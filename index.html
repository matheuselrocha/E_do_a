<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23161613'/%3E%3Cpath d='M50 16 22 28v20c0 17 12 29 28 36 16-7 28-19 28-36V28z' fill='none' stroke='%23c4321e' stroke-width='7' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
:root{
  --bg:#e9e9e3; --card:#fff; --ink:#181815; --ink2:#68685f; --ink3:#9c9c92;
  --rule:#dbdbd2; --rule2:#ecece5; --fogo:#c4321e; --fogo-d:#a72916; --feito:#3c6b4c;
  --topo:#161613; --topo2:#25251f; --sombra:0 1px 0 rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:Barlow,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(66px + env(safe-area-inset-bottom));
}
.num{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;min-height:100vh}
button{font:inherit}
a{color:inherit}

/* ---------- topo / orçamento ---------- */
.topo{
  position:sticky;top:0;z-index:20;color:#f3f3ee;
  background:linear-gradient(180deg,var(--topo2),var(--topo));
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  box-shadow:0 6px 18px -12px rgba(0,0,0,.5);
}
.topo .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.topo .hd .mk{font-family:"Barlow Semi Condensed";font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#c9c9bf}
.topo .hd .mk b{color:var(--fogo)}
.topo .hd .tela{margin-left:auto;font-size:11.5px;color:#8f8f85;letter-spacing:.04em;text-transform:uppercase}
.falta{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.falta b{font-family:"Barlow Semi Condensed";font-size:40px;font-weight:700;line-height:.92;letter-spacing:-.01em}
.falta span{font-size:13.5px;color:#a6a69c}
.sub{font-size:13px;color:#a6a69c;margin-top:5px}
.sub b{color:#e7e7df;font-weight:600}
.barra{height:5px;background:#39392f;border-radius:3px;margin-top:11px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--fogo);width:0;border-radius:3px;transition:width .3s ease}
.barra i.full{background:var(--feito)}
.fonte{display:flex;align-items:center;gap:6px;font-size:11px;color:#84847a;margin-top:9px;padding-top:8px;border-top:1px solid #333329}
.fonte .pt{width:6px;height:6px;border-radius:50%;background:#84847a;flex:none}
.fonte .pt.viva{background:#6fae7d;box-shadow:0 0 0 3px rgba(111,174,125,.18)}
.fonte a{color:#adad9f;margin-left:auto;text-decoration:none;border-bottom:1px solid #45453a;padding-bottom:1px}

/* ---------- filtros ---------- */
.filtros{display:flex;gap:6px;padding:12px 16px 2px}
.chip{
  flex:1;border:1px solid var(--rule);background:var(--card);color:var(--ink2);
  padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;min-height:38px;
}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#f3f3ee}
.chip:focus-visible{outline:2px solid var(--fogo);outline-offset:2px}

h2.grupo{
  display:flex;align-items:baseline;gap:8px;
  font-family:"Barlow Semi Condensed";font-size:12.5px;font-weight:700;letter-spacing:.08em;
  color:var(--ink2);margin:20px 16px 8px;text-transform:uppercase;
}
h2.grupo .sm{font-weight:600;color:var(--fogo);letter-spacing:.02em}
h2.grupo .rt{margin-left:auto;font-weight:600;color:var(--ink3);letter-spacing:.02em;text-transform:none;font-size:13px}
h2.grupo .rt b{color:var(--ink);font-weight:700}
.hint{font-size:12.5px;color:var(--ink2);padding:0 16px;margin:-2px 0 8px;line-height:1.5}

/* ---------- item / calculadora ---------- */
.lista{background:var(--card);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.item{border-top:1px solid var(--rule2)}
.item:first-child{border-top:none}
.linha{display:flex;align-items:flex-start;gap:11px;padding:11px 15px 12px}
.tick{
  flex:none;width:24px;height:24px;margin-top:2px;border:1.5px solid #c0c0b6;border-radius:6px;
  background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;
}
.tick svg{width:14px;height:14px;stroke:#fff;stroke-width:2.6;fill:none;opacity:0}
.tick[aria-checked=true]{background:var(--feito);border-color:var(--feito)}
.tick[aria-checked=true] svg{opacity:1}
.tick:focus-visible{outline:2px solid var(--fogo);outline-offset:2px}
.meio{flex:1;min-width:0}
.nome{font-weight:600;line-height:1.22;cursor:pointer}
.controls{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fafaf7}
.step button{width:34px;height:34px;border:none;background:transparent;font-size:19px;line-height:1;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.step button:active{background:var(--rule2)}
.step button:disabled{color:var(--ink3);cursor:default}
.step b{font-family:"Barlow Semi Condensed";font-size:16px;min-width:26px;text-align:center;border-left:1px solid var(--rule);border-right:1px solid var(--rule);align-self:stretch;display:grid;place-items:center}
.lojaBtn{
  display:inline-flex;align-items:center;gap:5px;min-height:34px;max-width:100%;
  border:1px solid var(--rule);border-radius:8px;background:#fafaf7;padding:5px 9px;cursor:pointer;
  font-size:13px;color:var(--ink);
}
.lojaBtn .lojaNome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;font-weight:600}
.lojaBtn svg{width:13px;height:13px;stroke:var(--ink3);stroke-width:2;fill:none;flex:none;transition:transform .2s}
.item.aberto .lojaBtn svg{transform:rotate(180deg)}
.lojaBtn.vazia{border-style:dashed;color:var(--ink3)}
.lojaBtn.vazia .lojaNome{color:var(--ink3)}
.sug{font-size:11.5px;color:var(--ink3);margin-top:7px}
.lojaBtn:focus-visible,.tick:focus-visible,.step button:focus-visible{outline:2px solid var(--fogo);outline-offset:2px}
.dir{text-align:right;flex:none;padding-left:2px;min-width:74px}
.dir .v{font-family:"Barlow Semi Condensed";font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.dir .un{font-size:11px;color:var(--ink3);margin-top:1px}
.item.ok .nome,.item.ok .dir .v{color:var(--ink3);text-decoration:line-through;text-decoration-thickness:1.5px}
.item.ok .un{color:var(--ink3)}
.item.zerado{opacity:.62}
.item.zerado .dir .v{color:var(--ink3)}

/* ---------- expansão: comparação de lojas ---------- */
.exp{display:none;padding:2px 15px 14px 50px}
.item.aberto .exp{display:block}
.exp .lbl{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:2px 0 6px}
.lj{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;margin-bottom:3px;
  border:1px solid transparent;border-radius:8px;background:#f6f6f1;cursor:pointer;
}
.lj[aria-pressed=true]{border-color:var(--ink);background:#fff;box-shadow:var(--sombra)}
.lj .n{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.lj .p{font-family:"Barlow Semi Condensed";font-weight:700;font-size:15.5px}
.lj .dif{font-size:11px;color:var(--ink3);width:46px;text-align:right;font-variant-numeric:tabular-nums}
.lj.menor .p{color:var(--feito)}
.lj.menor .dif{color:var(--feito);font-weight:600}
.lj .r0{width:18px;height:18px;flex:none;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center}
.lj[aria-pressed=true] .r0{border-color:var(--ink)}
.lj[aria-pressed=true] .r0::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink)}

/* ---------- painéis (lojas/contatos/online/bizus) ---------- */
.painel{background:var(--card);margin:0 0 1px;padding:14px 16px;box-shadow:var(--sombra)}
.rank{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--rule2)}
.rank:last-child{border-bottom:none}
.rank .pos{font-family:"Barlow Semi Condensed";font-size:14px;font-weight:700;color:var(--ink3);width:20px;text-align:center}
.rank .n{flex:1;font-size:14.5px;min-width:0;font-weight:600}
.rank .n small{display:block;color:var(--ink3);font-size:12px;font-weight:500;margin-top:1px}
.rank .p{font-family:"Barlow Semi Condensed";font-size:18px;font-weight:700}
.rank.top{background:linear-gradient(90deg,rgba(60,107,76,.08),transparent);margin:0 -16px;padding:11px 16px}
.rank.top .pos{color:var(--feito)}
.rank.top .p{color:var(--feito)}
.rank .cob{flex:none;font-family:"Barlow Semi Condensed";font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--rule2);color:var(--ink2)}
.rank .cob.baixa{background:#f4ddd8;color:var(--fogo-d)}
.aviso{font-size:12.5px;color:var(--ink2);margin:10px 16px 2px;line-height:1.5;
  border-left:3px solid var(--fogo);padding:8px 0 8px 11px;background:linear-gradient(90deg,rgba(196,50,30,.05),transparent)}
.aviso b{color:var(--ink)}
table.pag{width:100%;border-collapse:collapse;font-size:13.5px}
table.pag td{padding:9px 0;border-bottom:1px solid var(--rule2);vertical-align:top}
table.pag tr:last-child td{border-bottom:none}
table.pag td:first-child{font-weight:600;padding-right:10px;white-space:nowrap}
table.pag td:last-child{text-align:right;color:var(--ink2);padding-left:8px}
.cupom{display:flex;align-items:center;gap:11px;border:1px dashed var(--fogo);border-radius:9px;padding:11px 13px;margin-top:12px;font-size:13px;color:var(--ink2)}
.cupom .cd{font-family:"Barlow Semi Condensed";font-size:18px;font-weight:700;letter-spacing:.06em;color:var(--fogo-d);
  border:1px solid var(--fogo);border-radius:6px;padding:3px 9px;background:#fff;white-space:nowrap}

/* contatos */
.ct{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule2);align-items:flex-start}
.ct:last-child{border-bottom:none}
.ct .info{flex:1;min-width:0}
.ct .n{font-weight:600;font-size:14.5px;line-height:1.25}
.ct .i{font-size:12.5px;color:var(--ink3);margin-top:2px}
.ct .acts{display:flex;gap:6px;flex:none}
.ico{width:38px;height:38px;flex:none;border-radius:9px;display:grid;place-items:center;text-decoration:none;border:1px solid var(--rule)}
.ico svg{width:19px;height:19px}
.ico.zap{background:#25391f;border-color:#25391f}
.ico.zap svg{fill:#eafae6}
.ico.ig{background:#fff}
.ico.ig svg{fill:none;stroke:var(--ink);stroke-width:1.8}

/* online + bizus */
.card{background:var(--card);margin:0 12px 14px;padding:14px 16px;border-radius:13px;border:1px solid var(--rule);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card .tl{font-weight:700;font-size:15px}
.card .st{font-size:12.5px;color:var(--ink2);margin:3px 0 10px;line-height:1.4}
.pcat{font-family:"Barlow Semi Condensed";font-size:17px;font-weight:700;margin:0 0 11px;padding-bottom:9px;border-bottom:2px solid var(--rule);display:flex;align-items:baseline;gap:8px}
.pcat span{font-size:12px;font-weight:600;color:var(--fogo);font-family:Barlow,sans-serif}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.opt+.opt{border-top:1px solid var(--rule2)}
.thumb{width:78px;height:78px;flex:none;border-radius:10px;object-fit:cover;background:#f0f0ea;border:1px solid var(--rule);display:block}
.thumb.ph{position:relative}
.thumb.ph::after{content:"sem imagem";position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:9px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink3)}
.oinfo{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.ot{font-size:13px;font-weight:500;color:var(--ink);line-height:1.35;margin-bottom:10px}
.abrir.sm{width:auto;display:inline-flex;padding:9px 14px;font-size:13px;border-radius:8px;margin-top:auto}
.abrir{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;background:var(--fogo);color:#fff;
  text-align:center;border-radius:9px;text-decoration:none;font-weight:700;font-size:14px}
.abrir svg{width:15px;height:15px;stroke:#fff;stroke-width:2;fill:none}
.abrir:active{background:var(--fogo-d)}
.outras{margin-top:8px;font-size:13px}
.outras summary{cursor:pointer;padding:5px 0;color:var(--ink2);font-weight:600;list-style:none}
.outras summary::-webkit-details-marker{display:none}
.outras summary::before{content:"▾ ";color:var(--ink3)}
.outras[open] summary::before{content:"▴ "}
.outras a{display:block;padding:9px 0;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule2);font-size:13.5px}
.outras a:last-child{border-bottom:none}
.biz a{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule2);text-decoration:none;color:var(--ink);font-size:14px;font-weight:500}
.biz a:last-child{border-bottom:none}
.biz a .ar{margin-left:auto;color:var(--ink3);flex:none}
.biz a .ar svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;display:block}
.biz .tag{flex:none;width:30px;height:30px;border-radius:8px;background:var(--rule2);display:grid;place-items:center;font-size:15px}

/* ---------- rodapé ---------- */
.rodape{padding:22px 16px 12px;font-size:12px;color:var(--ink3);line-height:1.55}
.rodape a{color:var(--ink2)}
.zerar-linha{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.zerar{background:none;border:1px solid var(--rule);border-radius:8px;padding:9px 14px;font-size:12.5px;color:var(--ink2);cursor:pointer;min-height:40px}
.zerar:active{background:var(--card)}

/* ---------- abas ---------- */
.abas{
  position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;
  background:rgba(251,251,247,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom);
}
.abas .inner{display:flex;width:100%;max-width:480px}
.abas button{
  flex:1;border:none;background:none;font-size:10.5px;font-weight:600;
  color:var(--ink3);padding:8px 0 7px;cursor:pointer;display:grid;gap:3px;justify-items:center;min-height:56px;
}
.abas button svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.7;fill:none}
.abas button[aria-selected=true]{color:var(--fogo)}
.ico-wrap{position:relative;display:inline-grid;place-items:center}
.badge{position:absolute;top:-6px;right:-11px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--fogo);color:#fff;font-size:10px;font-weight:700;place-items:center;line-height:1;font-family:Barlow,sans-serif;box-shadow:0 0 0 2px rgba(251,251,247,.94)}

/* ---------- carrinho ---------- */
.painel.cart{border-radius:13px;border:1px solid var(--rule);margin:0 12px 12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cabLoja{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:4px;border-bottom:2px solid var(--rule)}
.cabLoja .cn{font-family:"Barlow Semi Condensed";font-size:17px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cabLoja .cm{font-size:12.5px;color:var(--ink2);font-weight:600;white-space:nowrap;flex:none}
.ci{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule2)}
.ci:last-child{border-bottom:none}
.ci .q{font-family:"Barlow Semi Condensed";font-weight:700;color:var(--fogo);min-width:28px}
.ci .nm{flex:1;font-size:14px;min-width:0;line-height:1.3}
.ci .pv{font-family:"Barlow Semi Condensed";font-weight:600;color:var(--ink2);white-space:nowrap}
.cart .abrir{margin-top:13px}
.ig-link{display:block;text-align:center;margin-top:9px;font-size:13px;color:var(--ink2);text-decoration:underline}
.vazio{text-align:center;padding:56px 30px 40px;color:var(--ink2)}
.vazio svg{width:54px;height:54px;stroke:var(--ink3);stroke-width:1.4;fill:none;margin-bottom:14px}
.vazio p{line-height:1.55;font-size:14.5px;margin:0}
.voltarCalc{margin-top:18px;background:var(--ink);color:#f3f3ee;border:none;border-radius:9px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
.voltarCalc:active{background:#000}
.abas button[aria-selected=true] svg{stroke-width:2}
.abas button:focus-visible{outline:2px solid var(--fogo);outline-offset:-3px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topo">
    <div class="hd">
      <span class="mk">Enxoval <b>·</b> CFP CBMDF 2026</span>
      <span class="tela" id="tTela">Calculadora</span>
    </div>
    <div class="falta"><b class="num" id="tFalta">—</b><span id="tLabel">ainda a comprar</span></div>
    <div class="sub" id="tSub">Carregando preços…</div>
    <div class="barra"><i id="tBarra"></i></div>
    <div class="fonte"><span class="pt" id="fPonto"></span><span id="fTexto">Lendo a planilha…</span>
      <a href="https://docs.google.com/spreadsheets/d/1QI-vGc--zXDDX3Tvq_F1i3bZGOFiY5o0C88MHbNrDGc/edit" target="_blank" rel="noopener">planilha</a>
    </div>
  </header>

  <main id="tela"></main>

  <div class="rodape">
    <p>Pesquisa feita por aprovados do CFP CBMDF 2026. Preço muda sem aviso — confirme na loja antes de comprar. Célula com preço zero na planilha = a loja não vende aquele item.</p>
    <div class="zerar-linha">
      <button class="zerar" id="btZerarLojas">Zerar lojas</button>
      <button class="zerar" id="btZerar">Zerar minhas escolhas</button>
    </div>
  </div>
</div>

<nav class="abas" role="tablist" aria-label="Seções"><div class="inner">
  <button role="tab" data-t="calc" aria-selected="true">

})();

/* =========================================================================
   Leitura da planilha (gviz — público, sem chave, sem backend)
   ========================================================================= */
function csv(txt){
  const linhas=[]; let l=[], c="", asp=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(asp){ if(ch==='"'){ if(txt[i+1]==='"'){c+='"';i++;} else asp=false; } else c+=ch; }
    else if(ch==='"') asp=true;
    else if(ch===","){ l.push(c); c=""; }
    else if(ch==="\n"){ l.push(c); linhas.push(l); l=[]; c=""; }
    else if(ch!=="\r") c+=ch;
  }
  if(c.length||l.length){ l.push(c); linhas.push(l); }
  return linhas;
}
const numBR = s => { const n = parseFloat(String(s).replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".")); return isNaN(n)?0:n; };

function moldar(linhas, lojasPorBloco){
  const fem = new Set(CFG.femininos);
  const saida = {};
  for(const chave of Object.keys(CFG.blocos))                 // mantém a ordem enxoval → coturno → equip
    saida[chave] = { lojas: lojasPorBloco[chave] || [], itens: [] };
  let bloco = "enxoval";                                       // o CSV começa no bloco de cima
  for(const ln of linhas){
    const a = String(ln[0]||"").trim().toUpperCase();
    const nome = String(ln[1]||"").trim();
    if(!nome){                                                 // linha sem item = divisor de seção ou linha em branco
      if(a === "COTURNOS" || a === "COTURNO") bloco = "coturno";
      else if(a.startsWith("EQUIPAMENTO")) bloco = "equip";
      continue;
    }
    const lojas = saida[bloco].lojas;                          // nomes das lojas por posição de coluna
    const p = {};
    for(let c=0;c<lojas.length;c++){ const v=numBR(ln[CFG.colInicial + c]); if(v>0) p[lojas[c]] = Math.round(v); }
    if(!Object.keys(p).length) continue;                       // sem nenhum preço válido → descarta (0 = não vende)
    saida[bloco].itens.push({ cat:String(ln[0]||"").trim(), nome, qtd:Math.round(numBR(ln[2])), p, g: fem.has(nome)?"F":"A" });
  }
  return saida;
}

const gviz = aba => `https://docs.google.com/spreadsheets/d/${CFG.planilhaId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(aba)}`;
async function lerCSV(aba){
  const r = await fetch(gviz(aba), {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status+" ("+aba+")");
  return csv(await r.text());
}

// Links de compra online, lidos ao vivo (categoria | descrição | URL em texto puro).
async function carregarOnline(){
  const linhas = await lerCSV(CFG.abaOnline);
  const mapa = new Map();                       // categoria -> {nome, op:[...]}, preservando a ordem da planilha
  for(const ln of linhas){
    const cat=String(ln[0]||"").trim();
    const t=String(ln[1]||"").trim();
    const u=String(ln[2]||"").trim();
    const img=String(ln[3]||"").trim();          // coluna D (opcional): imagem própria da planilha
    if(!/^https?:\/\//i.test(u)) continue;      // ignora cabeçalho ou linha sem URL válida
    if(!cat) continue;
    if(!mapa.has(cat)) mapa.set(cat, { nome:cat, op:[] });
    mapa.get(cat).op.push({ t: t||u, u, img: img || IMG_ONLINE[u] || "" });
  }
  return [...mapa.values()];
}

// Nomes das lojas por bloco, lidos ao vivo da aba de Validação (1 coluna por bloco).
async function carregarLojas(){
  const linhas = await lerCSV(CFG.abaLojas);
  const out = {};
  Object.keys(CFG.blocos).forEach((chave,col)=>{
    const nomes=[];
    for(let r=1;r<linhas.length;r++){ const v=String((linhas[r]||[])[col]||"").trim(); if(v) nomes.push(v); }
    out[chave]=nomes;
  });
  return out;
}

async function carregar(){
  let lojasBloco = SNAPSHOT.lojasPorBloco;
  try{
    const lb = await carregarLojas();
    if(Object.keys(CFG.blocos).every(k => (lb[k]||[]).length)) lojasBloco = lb;   // só confia se todos os blocos vieram
  }catch(e){ console.warn("Lista de lojas ao vivo falhou — usando cópia local:", e.message); }
  try{
    const blocos = moldar(await lerCSV(CFG.aba), lojasBloco);
    const n = Object.values(blocos).reduce((a,b)=>a+b.itens.length,0);
    if(n < 20) throw new Error("poucos itens lidos ("+n+")");
    DADOS = { ...SNAPSHOT, blocos };
    AO_VIVO = true;
  }catch(e){
    DADOS = SNAPSHOT;
    AO_VIVO = false;
    console.warn("Leitura ao vivo falhou — usando cópia local:", e.message);
  }
  try{
    const links = await carregarOnline();
    if(links.length) DADOS.links = links;       // links online ao vivo (fallback: snapshot)
  }catch(e){ console.warn("Links online ao vivo falharam — usando cópia local:", e.message); }
  desenhar();
}

const $ = s => document.querySelector(s);
const rs = v => "R$ " + Math.round(v).toLocaleString("pt-BR");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const idDe = (b,i) => b + "::" + i.nome;

function todos(){                                             // todos os itens, com id e bloco
  const out=[];
  for(const [chave,b] of Object.entries(DADOS.blocos))
    for(const it of b.itens) out.push({ ...it, bloco:chave, id:idDe(chave,it) });
  return out;
}
function visiveis(){ return todos(); }   // enxoval unificado — sem distinção de sexo

function melhor(it){
  let ln=null, pn=Infinity;
  for(const [l,p] of Object.entries(it.p)) if(p<pn){ pn=p; ln=l; }
  return { loja:ln, preco:pn };
}
const lojaDe = it => {
  const v = E.loja[it.id];
  return (v && it.p[v]) ? v : "";            // VAZIO por padrão; só preenche quando o usuário escolhe a loja
};
const qtdDe  = it => E.qtd[it.id] !== undefined ? E.qtd[it.id] : it.qtd;
const unDe   = it => it.p[lojaDe(it)] || 0;

function resumo(lista){
  let total=0, falta=0, feitos=0, itens=0;
  for(const it of lista){
    const q=qtdDe(it); if(q<=0) continue;
    itens++;
    const v=unDe(it)*q; total+=v;
    if(E.ok[it.id]) feitos++; else falta+=v;
  }
  return { total, falta, feitos, itens };
}

const NOME_TELA = { calc:"Calculadora", carrinho:"Seu carrinho", lojas:"Lojas & pagamento", online:"Compras online", bizus:"Bizus do CFP" };

function topo(){
  const r = resumo(visiveis());
  const pct = r.itens ? Math.round(r.feitos/r.itens*100) : 0;
  const fim = r.itens && r.feitos===r.itens;
  $("#tTela").textContent = NOME_TELA[E.aba] || "";
  $("#tFalta").textContent = fim ? "Tudo comprado" : rs(r.falta);
  $("#tLabel").textContent = fim ? "🎖" : "ainda a comprar";
  $("#tSub").innerHTML = `Orçamento <b>${rs(r.total)}</b> · ${r.feitos} de ${r.itens} itens marcados`;
  const b=$("#tBarra"); b.style.width=pct+"%"; b.classList.toggle("full",fim);
  $("#fPonto").className = "pt" + (AO_VIVO ? " viva" : "");
  $("#fTexto").textContent = AO_VIVO ? "Preços lidos da planilha agora" : "Cópia local — planilha não respondeu";
}

function chevron(){ return `<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>`; }

function itemHTML(it){
  const q=qtdDe(it), lj=lojaDe(it), un=it.p[lj]||0, ok=!!E.ok[it.id], zer=q<=0, semLoja=lj==="";
  const ord=Object.entries(it.p).sort((a,b)=>a[1]-b[1]), min=ord[0][1];
  const comp=ord.map(([l,p])=>`
    <button class="lj ${p===min?"menor":""}" data-loja="${esc(l)}" role="radio" aria-checked="${l===lj}">
      <span class="r0"></span>
      <span class="n">${esc(l)}</span><span class="p num">${rs(p)}</span>
      <span class="dif num">${p===min?"—":"+"+(p-min).toLocaleString("pt-BR")}</span>
    </button>`).join("");
  return `<article class="item ${ok?"ok":""} ${zer?"zerado":""}" data-id="${esc(it.id)}">
    <div class="linha">
      <button class="tick" role="checkbox" aria-checked="${ok}" aria-label="Marcar ${esc(it.nome)} como comprado">
        <svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></button>
      <div class="meio">
        <div class="nome">${esc(it.nome)}</div>
        <div class="controls">
          <span class="step" role="group" aria-label="Quantidade de ${esc(it.nome)}">
            <button data-d="-1" aria-label="Menos um" ${q<=0?"disabled":""}>−</button>
            <b class="num">${q}</b>
            <button data-d="1" aria-label="Mais um">+</button>
          </span>
          <button class="lojaBtn ${semLoja?"vazia":""}" aria-label="Escolher loja para ${esc(it.nome)}">
            <span class="lojaNome">${semLoja?"Escolher loja":esc(lj)}</span>${chevron()}
          </button>
        </div>
        <div class="sug num" title="Quantidade sugerida na planilha">sugerido: ${it.qtd}</div>
      </div>
      <div class="dir"><div class="v num">${rs(un*q)}</div><div class="un num">${semLoja?"sem loja":rs(un)+" cada"}</div></div>
    </div>
    <div class="exp" role="radiogroup" aria-label="Lojas que vendem ${esc(it.nome)}">
      <div class="lbl">${ord.length} loja${ord.length>1?"s":""} · da mais barata p/ mais cara</div>
      ${comp}
    </div>
  </article>`;
}

function telaCalc(){
  const its=visiveis(), por={};
  for(const it of its) (por[it.bloco] ||= []).push(it);

  for(const [chave,cfg] of Object.entries(CFG.blocos)){
    const lista=por[chave]; if(!lista?.length) continue;
    const r=resumo(lista);
    h+=`<h2 class="grupo">${esc(cfg.titulo)} <span class="sm">${lista.length}</span>
        <span class="rt">subtotal <b>${rs(r.total)}</b></span></h2>
      <div class="lista">${lista.map(itemHTML).join("")}</div>`;
  }
  return h;
}

/* =========================================================================
   Tela 2 — Lojas (contatos + pagamento + cupom)
   ========================================================================= */
function telaLojas(){
  let h=`<h2 class="grupo">Contatos das lojas <span class="rt">Brasília e online</span></h2><div class="painel">`;
  for(const [nome,tel,insta,igurl] of DADOS.contatos){
    const zap=tel.replace(/\D/g,"");
    h+=`<div class="ct"><div class="info">
        <div class="n">${esc(nome)}</div>
        <div class="i">${esc(tel)}${insta?" · "+esc(insta):""}</div>
      </div><div class="acts">
        <a class="ico zap" href="https://wa.me/55${zap}" target="_blank" rel="noopener" aria-label="WhatsApp de ${esc(nome)}">${svgZap()}</a>
        ${igurl?`<a class="ico ig" href="${esc(igurl)}" target="_blank" rel="noopener" aria-label="Instagram de ${esc(nome)}">${svgIg()}</a>`:""}

  h+=`</div><p class="aviso">Chama no WhatsApp pra confirmar preço, tamanho e prazo antes de ir. Alguns números são fixos — se o WhatsApp não abrir, ligue.</p>`;

  h+=`<h2 class="grupo">Pagamento e desconto à vista</h2><div class="painel"><table class="pag">`;

    h+=`<tr><td>${esc(loja)}</td><td>${esc(parc)} · ${esc(desc)}</td></tr>`;

      <span>${DADOS.cupom.pct} de desconto na <b>${esc(DADOS.cupom.loja)}</b></span></div></div>`;
  return h;
}

/* =========================================================================
   Tela 3 — Online

function telaOnline(){

  for(const l of lista){

/* SVGs de contato (usados na Tela 2 — Lojas) */
function svgZap(){ return `<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.1-1.3A10 10 0 1012 2zm5.5 14c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.4-1.1-2.7 0-1.3.7-1.9 1-2.2.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.5c-.2.2-.3.4-.1.7.2.3.9 1.4 1.9 2 .8.5 1.1.5 1.4.4.2-.1.5-.5.7-.8.2-.2.4-.2.6-.1l1.9.9c.2.1.4.2.5.3.1.3.1.9-.1 1.5z"/></svg>`; }
function svgIg(){ return `<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="17" cy="7" r="1.1" fill="currentColor" stroke="none"/></svg>`; }

/* =========================================================================
   Tela — Carrinho (itens agrupados pela loja escolhida na calculadora)
   ========================================================================= */
function carrinho(){                                  // derivado do estado (loja + qtd por item)
  const grupos = new Map();
  for(const it of todos()){
    const lj = lojaDe(it), q = qtdDe(it);
    if(!lj || q<=0) continue;                          // sem loja escolhida ou qtd 0 → fora do carrinho
    if(!grupos.has(lj)) grupos.set(lj, { loja:lj, itens:[], nItens:0, subtotal:0 });
    const g = grupos.get(lj), un = it.p[lj]||0;
    g.itens.push({ nome:it.nome, q, un, sub:un*q });
    g.nItens++; g.subtotal += un*q;
  }
  return [...grupos.values()];
}
function contatoDe(loja){                              // casa o nome da loja (preços) com a aba de contatos
  const cs = DADOS.contatos||[], L = loja.toLowerCase().trim();
  return cs.find(x=>x[0].toLowerCase().trim()===L)
      || cs.find(x=>x[0].toLowerCase().trim().startsWith(L))
      || cs.find(x=>{ const fw=x[0].toLowerCase().split(" ")[0]; return fw.length>2 && L.startsWith(fw); })
      || null;
}
function msgWhats(g){
  const linhas = g.itens.map(i=>`• ${i.q}x ${i.nome}`).join("\n");
  return `Olá! Sou do CFP CBMDF 2026 e gostaria de comprar na ${g.loja}:\n\n${linhas}\n\nPode me passar valores, formas de pagamento e disponibilidade? Obrigado(a)!`;
}
function telaCarrinho(){
  const grupos = carrinho();
  if(!grupos.length)
    return `<div class="vazio">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.5 3H5l2.3 11.4a1.5 1.5 0 001.5 1.2h8.4a1.5 1.5 0 001.5-1.2L21.5 7H6.2"/></svg>
      <p><b>Seu carrinho está vazio.</b><br>Volte à calculadora e escolha a loja de cada item que você quer comprar.</p>
      <button class="voltarCalc">Ir para a calculadora</button>
    </div>`;
  let h=`<h2 class="grupo">Seu carrinho <span class="rt">agrupado por loja</span></h2>`;
  for(const g of grupos){
    const c = contatoDe(g.loja);
    let acao = "";
    if(c){
      const tel=(c[1]||"").replace(/\D/g,""), ig=c[3]||"";
      if(tel){
        acao=`<a class="abrir" href="https://wa.me/55${tel}?text=${encodeURIComponent(msgWhats(g))}" target="_blank" rel="noopener">Enviar para ${esc(g.loja)}
          <svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></a>`;
        if(ig) acao+=`<a class="ig-link" href="${esc(ig)}" target="_blank" rel="noopener">ou falar pelo Instagram</a>`;
      } else if(ig){
        acao=`<a class="abrir" href="${esc(ig)}" target="_blank" rel="noopener">Abrir Instagram de ${esc(g.loja)}</a>`;
      }
    }
    h+=`<div class="painel cart">
      <div class="cabLoja"><span class="cn">${esc(g.loja)}</span><span class="cm num">${g.nItens} ${g.nItens>1?"itens":"item"} · ${rs(g.subtotal)}</span></div>
      <div class="citens">${g.itens.map(i=>`<div class="ci"><span class="q num">${i.q}×</span><span class="nm">${esc(i.nome)}</span><span class="pv num">${rs(i.sub)}</span></div>`).join("")}</div>
      ${acao}
    </div>`;
  }
  return h;
}

/* =========================================================================
   Tela 4 — Bizus
   ========================================================================= */
const ICONE_GRUPO = {"Arquivos base":"📁","Ordem unida":"🥾","Hinos e canções":"🎵","Nós e amarrações":"🪢","Cuidado com os pés":"🦶","Manutenção do coturno":"🥾","Kit costura":"🧵","Outros":"⭐"};
function telaBizus(){

      h+=`<a href="${esc(u)}" target="_blank" rel="noopener nofollow">

/* =========================================================================
   Desenhar + navegação
   ========================================================================= */
function desenhar(){
  if(!DADOS) return;
  const t=E.aba;
  $("#tela").innerHTML =
    t==="carrinho" ? telaCarrinho() :
    t==="lojas" ? telaLojas() :
    t==="online" ? telaOnline() :
    t==="bizus" ? telaBizus() : telaCalc();
  document.querySelectorAll(".abas button").forEach(b=>b.setAttribute("aria-selected", b.dataset.t===t));
  const nc = carrinho().reduce((a,g)=>a+g.nItens,0);
  const bd = $("#cartBadge"); if(bd){ bd.textContent = nc; bd.style.display = nc ? "grid" : "none"; }
  topo();
}

/* =========================================================================
   Interação
   ========================================================================= */
document.addEventListener("click", ev => {
  const aba = ev.target.closest(".abas button");
  if(aba){ E.aba=aba.dataset.t; salvar(); desenhar(); window.scrollTo(0,0); return; }

  if(ev.target.closest(".voltarCalc")){ E.aba="calc"; salvar(); desenhar(); window.scrollTo(0,0); return; }

  const art = ev.target.closest(".item");
  if(!art) return;
  const id = art.dataset.id;
  const it = visiveis().find(x=>x.id===id); if(!it) return;

  if(ev.target.closest(".tick")){ E.ok[id]=!E.ok[id]; salvar(); desenhar(); return; }

  const passo = ev.target.closest(".step button");
  if(passo){ E.qtd[id]=Math.max(0, qtdDe(it) + (+passo.dataset.d)); salvar(); desenhar(); return; }

  const lj = ev.target.closest(".lj");
  if(lj){ const nova=lj.dataset.loja; E.loja[id] = (E.loja[id]===nova) ? "" : nova; salvar(); desenhar(); return; }  // toca de novo p/ limpar

  if(ev.target.closest(".lojaBtn") || ev.target.closest(".nome")){ art.classList.toggle("aberto"); return; }
});

$("#btZerar").addEventListener("click", () => {
  if(!confirm("Isso apaga suas quantidades, escolhas de loja e o que você já marcou como comprado. Continuar?")) return;
  E = { qtd:{}, loja:{}, ok:{}, aba:E.aba };
  salvar(); desenhar(); window.scrollTo(0,0);
});

$("#btZerarLojas").addEventListener("click", () => {
  if(!confirm("Isso deixa a loja de todos os itens em branco e o valor zerado, pra você escolher loja por loja. Suas quantidades e marcações continuam. Continuar?")) return;
  for(const it of todos()) E.loja[it.id] = "";   // "" = loja em branco (valor 0)
  salvar(); desenhar(); window.scrollTo(0,0);
});

// Recarrega os preços quando você volta pro app
document.addEventListener("visibilitychange", () => { if(!document.hidden) carregar(); });

carregar();
</script>
