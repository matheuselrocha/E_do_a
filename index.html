<style>
:root{
  --bg:#EFEEE8; --card:#fff; --ink:#16180F; --ink2:#4B5054; --ink3:#9A9A90;
  --rule:#DCDACF; --rule2:#ECEBE3; --fogo:#E4670E; --fogo-d:#B44F07; --feito:#6B8A46;
  --topo:#22291A; --topo2:#2E3626; --sombra:0 1px 0 rgba(0,0,0,.05);
  --marca:#3E4A2F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:Barlow,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(66px + env(safe-area-inset-bottom));
}
.num{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;min-height:100vh}
button{font:inherit}
a{color:inherit}

/* ---------- topo / orçamento ---------- */
.topo{
  position:sticky;top:0;z-index:20;color:#f3f3ee;
  background:linear-gradient(180deg,var(--topo2),var(--topo));
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  box-shadow:0 6px 18px -12px rgba(0,0,0,.5);
}
.topo .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.topo .hd .sig{width:30px;height:30px;flex:none;background:var(--marca);display:grid;place-items:center}
.topo .hd .sig svg{width:17px;height:17px;fill:none;stroke:var(--fogo);stroke-width:9;stroke-linecap:square;display:block}
.topo .hd .mk{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:16px;line-height:1;letter-spacing:-.01em;text-transform:uppercase;color:#F2F1EA}
.topo .hd .mk b{display:block;margin-top:2px;font-weight:700;font-size:8.5px;letter-spacing:.11em;color:#A9B097}
.topo .hd .concurso{font-family:Archivo,system-ui,sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.04em;color:#F3F1EA;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 13px;text-transform:uppercase;white-space:nowrap}
.topo .hd .tela{margin-left:auto;font-size:10px;font-weight:600;color:#8A9179;letter-spacing:.05em;text-transform:uppercase}
.falta{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.falta b{font-family:"Barlow Semi Condensed";font-size:40px;font-weight:700;line-height:.92;letter-spacing:-.01em}
.falta b.cta{font-size:25px;letter-spacing:0;line-height:1.1}
.falta span{font-size:13.5px;color:#A0A597}
.sub{font-size:13px;color:#A0A597;margin-top:5px}
.sub b{color:#E9E8E0;font-weight:600}
.barra{height:5px;background:#39412E;border-radius:3px;margin-top:11px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--fogo);width:0;border-radius:3px;transition:width .3s ease}
.barra i.full{background:var(--feito)}
.fonte{display:flex;align-items:center;gap:6px;font-size:11px;color:#858B76;margin-top:9px;padding-top:8px;border-top:1px solid #333B27}
.fonte .pt{width:6px;height:6px;border-radius:50%;background:#858B76;flex:none}
.fonte .pt.viva{background:#8FBF5F;box-shadow:0 0 0 3px rgba(143,191,95,.18)}
.fonte a{color:#AEB49E;margin-left:auto;text-decoration:none;border-bottom:1px solid #47503A;padding-bottom:1px}

/* ---------- filtros ---------- */
.filtros{display:flex;gap:6px;padding:12px 16px 2px}
.chip{
  flex:1;border:1px solid var(--rule);background:var(--card);color:var(--ink2);
  padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;min-height:38px;
}
.chip[aria-pressed=true]{background:var(--marca);border-color:var(--marca);color:#f3f3ee}
.chip:focus-visible{outline:2px solid var(--fogo);outline-offset:2px}

h2.grupo{
  display:flex;align-items:baseline;gap:8px;
  font-family:Archivo,system-ui,sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;
  color:var(--ink2);margin:20px 16px 8px;text-transform:uppercase;
}
h2.grupo .sm{font-weight:600;color:var(--fogo);letter-spacing:.02em}
h2.grupo .rt{margin-left:auto;font-weight:600;color:var(--ink3);letter-spacing:.02em;text-transform:none;font-size:13px}
h2.grupo .rt b{color:var(--ink);font-weight:700}
.hint{font-size:12.5px;color:var(--ink2);padding:0 16px;margin:-2px 0 8px;line-height:1.5}

/* ---------- item / calculadora ---------- */
.lista{background:var(--card);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.item{border-top:1px solid var(--rule2)}
.item:first-child{border-top:none}
.linha{display:flex;align-items:flex-start;gap:11px;padding:11px 15px 12px}
.tick{
  flex:none;width:24px;height:24px;margin-top:2px;border:1.5px solid #C4C2B6;border-radius:6px;
  background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;
}
.tick svg{width:14px;height:14px;stroke:#fff;stroke-width:2.6;fill:none;opacity:0}
.tick[aria-checked=true]{background:var(--feito);border-color:var(--feito)}
.tick[aria-checked=true] svg{opacity:1}
.tick:focus-visible{outline:2px solid var(--fogo);outline-offset:2px}
.item .foto{width:46px;height:46px;flex:none;margin-top:2px;border-radius:8px;object-fit:cover;background:#f0f0ea;border:1px solid var(--rule);display:block}
.meio{flex:1;min-width:0}
.nome{font-weight:600;line-height:1.22;cursor:pointer}
.controls{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fafaf7}
.step button{width:34px;height:34px;border:none;background:transparent;font-size:19px;line-height:1;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.step button:active{background:var(--rule2)}
.step button:disabled{color:var(--ink3);cursor:default}
.step b{font-family:"Barlow Semi Condensed";font-size:16px;min-width:26px;text-align:center;border-left:1px solid var(--rule);border-right:1px solid var(--rule);align-self:stretch;display:grid;place-items:center}
.lojaBtn{
  display:inline-flex;align-items:center;gap:5px;min-height:34px;max-width:100%;
  border:1px solid var(--rule);border-radius:8px;background:#fafaf7;padding:5px 9px;cursor:pointer;
  font-size:13px;color:var(--ink);
}
.lojaBtn .lojaNome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;font-weight:600}
.lojaBtn svg{width:13px;height:13px;stroke:var(--ink3);stroke-width:2;fill:none;flex:none;transition:transform .2s}
.item.aberto .lojaBtn svg{transform:rotate(180deg)}
.lojaBtn.vazia{border-style:dashed;color:var(--ink3)}
.lojaBtn.vazia .lojaNome{color:var(--ink3)}
.sug{font-size:11.5px;color:var(--ink3);margin-top:7px}
.lojaBtn:focus-visible,.tick:focus-visible,.step button:focus-visible{outline:2px solid var(--fogo);outline-offset:2px}
.dir{text-align:right;flex:none;padding-left:2px;min-width:74px}
.dir .v{font-family:"Barlow Semi Condensed";font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.dir .un{font-size:11px;color:var(--ink3);margin-top:1px}
.item.nocart{background:linear-gradient(90deg,rgba(107,138,70,.08),transparent)}
.item.nocart .linha{box-shadow:inset 3px 0 0 var(--feito)}
.item.zerado{opacity:.62}
.item.zerado .dir .v{color:var(--ink3)}

/* ---------- expansão: comparação de lojas ---------- */
.exp{display:none;padding:2px 15px 14px 50px}
.item.aberto .exp{display:block}
.exp .lbl{font-family:Archivo,system-ui,sans-serif;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:2px 0 7px}
.lj{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;margin-bottom:3px;
  border:1px solid transparent;border-radius:8px;background:#f6f6f1;cursor:pointer;color:var(--ink);
}
.lj[aria-checked=true]{border-color:var(--ink);background:#fff;box-shadow:var(--sombra)}
.lj .n{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--ink)}
.lj .p{font-family:"Barlow Semi Condensed";font-weight:700;font-size:15.5px;color:var(--ink)}
.lj .dif{font-size:11px;color:var(--ink3);width:46px;text-align:right;font-variant-numeric:tabular-nums}
.lj.menor .n{color:var(--feito);font-weight:600}
.lj.menor .p{color:var(--feito)}
.lj.menor .dif{color:var(--feito);font-weight:600}
.lj .r0{width:18px;height:18px;flex:none;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center}
.lj[aria-checked=true] .r0{border-color:var(--ink)}
.lj[aria-checked=true] .r0::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink)}

/* ---------- painéis (lojas/contatos/online/bizus) ---------- */
.painel{background:var(--card);margin:0 0 1px;padding:14px 16px;box-shadow:var(--sombra)}
.rank{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--rule2)}
.rank:last-child{border-bottom:none}
.rank .pos{font-family:"Barlow Semi Condensed";font-size:14px;font-weight:700;color:var(--ink3);width:20px;text-align:center}
.rank .n{flex:1;font-size:14.5px;min-width:0;font-weight:600}
.rank .n small{display:block;color:var(--ink3);font-size:12px;font-weight:500;margin-top:1px}
.rank .p{font-family:"Barlow Semi Condensed";font-size:18px;font-weight:700}
.rank.top{background:linear-gradient(90deg,rgba(107,138,70,.09),transparent);margin:0 -16px;padding:11px 16px}
.rank.top .pos{color:var(--feito)}
.rank.top .p{color:var(--feito)}
.rank .cob{flex:none;font-family:"Barlow Semi Condensed";font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--rule2);color:var(--ink2)}
.rank .cob.baixa{background:#F6E3D2;color:var(--fogo-d)}
.aviso{font-size:12.5px;color:var(--ink2);margin:10px 16px 2px;line-height:1.5;
  border-left:3px solid var(--fogo);padding:8px 0 8px 11px;background:linear-gradient(90deg,rgba(228,103,14,.06),transparent)}
.aviso b{color:var(--ink)}
table.pag{width:100%;border-collapse:collapse;font-size:13.5px}
table.pag td{padding:9px 0;border-bottom:1px solid var(--rule2);vertical-align:top}
table.pag tr:last-child td{border-bottom:none}
table.pag td:first-child{font-weight:600;padding-right:10px;white-space:nowrap}
table.pag td:last-child{text-align:right;color:var(--ink2);padding-left:8px}
.cupom{display:flex;align-items:center;gap:11px;border:1px dashed var(--fogo);border-radius:9px;padding:11px 13px;margin-top:12px;font-size:13px;color:var(--ink2)}
.cupom .cd{font-family:"Barlow Semi Condensed";font-size:18px;font-weight:700;letter-spacing:.06em;color:var(--fogo-d);
  border:1px solid var(--fogo);border-radius:6px;padding:3px 9px;background:#fff;white-space:nowrap}

/* contatos */
.ct{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule2);align-items:flex-start}
.ct:last-child{border-bottom:none}
.ct .info{flex:1;min-width:0}
.ct .n{font-weight:600;font-size:14.5px;line-height:1.25}
.ct .i{font-size:12.5px;color:var(--ink3);margin-top:2px}
.ct .acts{display:flex;gap:6px;flex:none}
.ico{width:38px;height:38px;flex:none;border-radius:9px;display:grid;place-items:center;text-decoration:none;border:1px solid var(--rule)}
.ico svg{width:19px;height:19px}
.ico.zap{background:#2A331F;border-color:#2A331F}
.ico.zap svg{fill:#eafae6}
.ico.ig{background:#fff}
.ico.ig svg{fill:none;stroke:var(--ink);stroke-width:1.8}
.ico.map{background:#fff}
.ico.map svg{fill:none;stroke:var(--feito);stroke-width:1.8}

/* online + bizus */
.card{background:var(--card);margin:0 12px 14px;padding:14px 16px;border-radius:13px;border:1px solid var(--rule);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card .tl{font-weight:700;font-size:15px}
.card .st{font-size:12.5px;color:var(--ink2);margin:3px 0 10px;line-height:1.4}
.pcat{font-family:"Barlow Semi Condensed";font-size:17px;font-weight:700;margin:0 0 11px;padding-bottom:9px;border-bottom:2px solid var(--rule);display:flex;align-items:baseline;gap:8px}
.pcat span{font-size:12px;font-weight:600;color:var(--fogo);font-family:Barlow,sans-serif}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.opt+.opt{border-top:1px solid var(--rule2)}
.thumb{width:78px;height:78px;flex:none;border-radius:10px;object-fit:cover;background:#f0f0ea;border:1px solid var(--rule);display:block}
.thumb.ph{position:relative}
.thumb.ph::after{content:"sem imagem";position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:9px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink3)}
.oinfo{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.ot{font-size:13px;font-weight:500;color:var(--ink);line-height:1.35;margin-bottom:10px}
.abrir.sm{width:auto;display:inline-flex;padding:9px 14px;font-size:13px;border-radius:8px;margin-top:auto}
.abrir{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;background:var(--fogo);color:#fff;
  text-align:center;border-radius:9px;text-decoration:none;font-family:Archivo,system-ui,sans-serif;font-weight:700;font-size:14px;letter-spacing:.01em}
.abrir svg{width:15px;height:15px;stroke:#fff;stroke-width:2;fill:none}
.abrir:active{background:var(--fogo-d)}
.outras{margin-top:8px;font-size:13px}
.outras summary{cursor:pointer;padding:5px 0;color:var(--ink2);font-weight:600;list-style:none}
.outras summary::-webkit-details-marker{display:none}
.outras summary::before{content:"▾ ";color:var(--ink3)}
.outras[open] summary::before{content:"▴ "}
.outras a{display:block;padding:9px 0;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule2);font-size:13.5px}
.outras a:last-child{border-bottom:none}
.biz a{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule2);text-decoration:none;color:var(--ink);font-size:14px;font-weight:500}
.biz a:last-child{border-bottom:none}
.biz a .ar{margin-left:auto;color:var(--ink3);flex:none}
.biz a .ar svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;display:block}
.biz .tag{flex:none;width:30px;height:30px;border-radius:8px;background:var(--rule2);display:grid;place-items:center;font-size:15px}

/* ---------- rodapé ---------- */
.rodape{padding:22px 16px 12px;font-size:12px;color:var(--ink3);line-height:1.55}
.rodape a{color:var(--ink2)}
.rodape .copy{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--rule);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink2)}
.ferramentas{display:flex;gap:7px;padding:0 16px;margin:2px 0 6px;flex-wrap:wrap}
.ferbtn{flex:1;min-width:96px;min-height:40px;border:1px solid var(--rule);background:var(--card);border-radius:9px;padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;line-height:1.15}
.ferbtn:active{background:var(--bg)}
.ferbtn.forte{background:var(--ink);border-color:var(--ink);color:#f3f3ee}
.ferbtn.ghost{color:var(--ink2)}
.ferbtn:focus-visible{outline:2px solid var(--fogo);outline-offset:2px}

/* ---------- abas ---------- */
.abas{
  position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;
  background:rgba(247,246,241,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom);
}
.abas .inner{display:flex;width:100%;max-width:480px}
.abas button{
  flex:1;border:none;background:none;font-size:10.5px;font-weight:600;
  color:var(--ink3);padding:8px 0 7px;cursor:pointer;display:grid;gap:3px;justify-items:center;min-height:56px;
}
.abas button svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.7;fill:none}
.abas button[aria-selected=true]{color:var(--fogo)}
.ico-wrap{position:relative;display:inline-grid;place-items:center}
.badge{position:absolute;top:-6px;right:-11px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--fogo);color:#fff;font-size:10px;font-weight:700;place-items:center;line-height:1;font-family:Barlow,sans-serif;box-shadow:0 0 0 2px rgba(247,246,241,.94)}

/* ---------- carrinho ---------- */
.painel.cart{border-radius:13px;border:1px solid var(--rule);margin:0 12px 12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cabLoja{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:4px;border-bottom:2px solid var(--rule)}
.cnwrap{display:flex;align-items:center;gap:8px;min-width:0}
.cabLoja .cn{font-family:"Barlow Semi Condensed";font-size:17px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cabLoja .cm{font-size:12.5px;color:var(--ink2);font-weight:600;white-space:nowrap;flex:none}
.mapsPin{display:inline-grid;place-items:center;width:28px;height:28px;flex:none;border:1px solid var(--rule);border-radius:7px;background:#fff;color:var(--feito);text-decoration:none}
.mapsPin svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none}
.mapsPin:active{background:var(--bg)}
.ci{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule2)}
.ci:last-child{border-bottom:none}
.ci .q{font-family:"Barlow Semi Condensed";font-weight:700;color:var(--fogo);min-width:28px}
.ci .nmwrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ci .nm{font-size:14px;line-height:1.3}
.ci .pv{font-family:"Barlow Semi Condensed";font-weight:600;color:var(--ink2);white-space:nowrap}
.consultar{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;margin-top:3px;padding:4px 0;background:none;border:none;font:inherit;font-size:12px;font-weight:700;color:var(--fogo);cursor:pointer}
.consultar svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.3;fill:none}

.topo .hd .concurso svg{width:15px;height:15px;stroke:var(--fogo);stroke-width:2.3;fill:none;flex:none}

/* ============================================================
   DESKTOP (≥ 880px) — aproveita a tela larga do PC.
   Só afeta telas grandes; a versão mobile fica inalterada.
   ============================================================ */
@media (min-width:880px){
  .app{max-width:1160px}

  /* Navegação permanece fixa embaixo (igual mobile), porém centralizada e mais larga */
  .abas .inner{max-width:640px}

  /* Cabeçalho/orçamento continua no topo */
  .topo{border-radius:0 0 18px 18px;padding:20px 28px 16px}
  .topo .hd{margin-bottom:12px}
  .topo .hd .mk{font-size:19px}
  .falta,.sub,.barra,.fonte{max-width:620px}
  .falta b{font-size:46px}

  .hint{max-width:780px}
  .ferramentas{max-width:640px}
  .rodape{max-width:820px}

  /* CALCULADORA — itens em grade de 2 colunas (cada item vira um cartão) */
  #tela[data-aba="calc"] .lista{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;
    background:transparent;border:none;padding:0 14px;
  }
  #tela[data-aba="calc"] .lista .item{border:1px solid var(--rule);border-radius:12px;background:var(--card)}
  #tela[data-aba="calc"] .lista .item:first-child{border-top:1px solid var(--rule)}
  #tela[data-aba="calc"] .lista .item.nocart .linha{border-radius:12px}

  /* ONLINE — cards em colunas tipo "masonry": empacotam sem buracos,
     mesmo com categorias de alturas bem diferentes. */
  #tela[data-aba="online"]{
    column-width:330px;column-gap:16px;padding:0 14px;
  }
  #tela[data-aba="online"]>h2.grupo{column-span:all;margin:20px 2px 8px}
  #tela[data-aba="online"] .card{
    margin:0 0 16px;break-inside:avoid;-webkit-column-break-inside:avoid;
  }

  /* CARRINHO — painéis de loja em grade de 2 colunas */
  #tela[data-aba="carrinho"]{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start}
  #tela[data-aba="carrinho"]>.cartTotal,
  #tela[data-aba="carrinho"]>h2.grupo,
  #tela[data-aba="carrinho"]>.hint,
  #tela[data-aba="carrinho"]>.vazio{grid-column:1/-1}
  #tela[data-aba="carrinho"] .painel.cart{margin:0 12px 16px}

  /* LOJAS — contatos em 2 colunas (a tabela de pagamento fica cheia) */
  #tela[data-aba="lojas"] .painel:has(.ct){display:grid;grid-template-columns:1fr 1fr;column-gap:28px}

  /* BIZUS — links distribuídos em 2 colunas dentro de cada grupo */
  #tela[data-aba="bizus"] .painel.biz{column-count:2;column-gap:32px}
  #tela[data-aba="bizus"] .painel.biz a{break-inside:avoid}
}

/* =========================================================================
   Leitura da planilha (gviz — público, sem chave, sem backend)
   ========================================================================= */
function csv(txt){
  const linhas=[]; let l=[], c="", asp=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(asp){ if(ch==='"'){ if(txt[i+1]==='"'){c+='"';i++;} else asp=false; } else c+=ch; }
    else if(ch==='"') asp=true;
    else if(ch===","){ l.push(c); c=""; }
    else if(ch==="\n"){ l.push(c); linhas.push(l); l=[]; c=""; }
    else if(ch!=="\r") c+=ch;
  }
  if(c.length||l.length){ l.push(c); linhas.push(l); }
  return linhas;
}
const numBR = s => { const n = parseFloat(String(s).replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".")); return isNaN(n)?0:n; };

// Converte link de imagem do Google Drive (compartilhamento) em URL exibível por <img>.
// Ex.: .../file/d/ID/view  ou  ?id=ID  ->  https://drive.google.com/thumbnail?id=ID&sz=w600
// URLs de outros domínios (mlstatic, wixstatic, etc.) passam direto.
function fotoURL(u){
  u = String(u||"").trim();
  if(!/^https?:\/\//i.test(u)) return "";
  const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=|thumbnail\?(?:[^#]*&)?id=)([-\w]{20,})/i) || u.match(/[?&]id=([-\w]{20,})/);
  return m ? "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w600" : u;
}

// Localiza uma coluna pelo nome do cabeçalho (aceita variações). -1 se não achar.
function acharCol(header, ...nomes){
  const norm = s => String(s||"").trim().toLowerCase();
  const alvo = nomes.map(norm);
  for(let i=0;i<header.length;i++){ if(alvo.includes(norm(header[i]))) return i; }
  return -1;
}

// Lê uma aba de preços guiada pelo CABEÇALHO. À esquerda ficam as colunas de meta
// (Estado, Concurso, Categoria, Item/Acessórios, Qtd Sugerida, Link da Foto); as lojas vêm logo depois.
// Mantém só os itens dos concursos permitidos (CFG.concursos) e marca cada item com o seu concurso;
// o filtro por concurso selecionado acontece na exibição (todos()). Categoria CFG.coturnoCat vai pro grupo "coturno".
function moldarTabela(linhas, blocoDefault, saida){
  const fem = new Set(CFG.femininos);
  const header = linhas[0] || [];
  const iConc = acharCol(header, "Concurso");
  const iCat  = acharCol(header, "Categoria");
  const iItem = acharCol(header, "Item Padronizado", "Acessórios", "Acessorios", "Item");
  const iQtd  = acharCol(header, "Qtd Sugerida", "Qtd", "Quantidade");
  const iFoto = acharCol(header, "Link da Foto", "Foto", "Imagem");
  const metaMax = Math.max(iCat, iItem, iQtd, iFoto);           // as lojas começam após a última coluna de meta
  const lojaIni = (metaMax>=0 ? metaMax : (CFG.colInicial-1)) + 1;
  const lojas = header.slice(lojaIni).map(s=>String(s).trim()).filter(Boolean);
  for(let r=1;r<linhas.length;r++){
    const ln = linhas[r]; if(!ln) continue;
    const conc = iConc>=0 ? String(ln[iConc]||"").trim() : "";
    if(!IDS_CONCURSO.has(conc)) continue;   // vazio / fora do allowlist (ex.: CFO PMDF) = incompleto → ignora
    const nome = String(ln[iItem]||"").trim(); if(!nome) continue;
    const cat = String(ln[iCat]||"").trim();
    const p = {};
    for(let c=0;c<lojas.length;c++){ const v=numBR(ln[lojaIni+c]); if(v>0) p[lojas[c]] = Math.round(v); }
    if(!Object.keys(p).length) continue;                       // vazio/"-"/0 = loja não vende → descarta se nenhum preço
    const bloco = (cat===CFG.coturnoCat) ? "coturno" : blocoDefault;
    if(!saida[bloco]) continue;
    if(!saida[bloco].lojas.length) saida[bloco].lojas = lojas;
    const foto = iFoto>=0 ? fotoURL(ln[iFoto]) : "";
    saida[bloco].itens.push({ cat, nome, qtd:Math.round(numBR(ln[iQtd])), p, g: fem.has(nome)?"F":"A", foto, concurso:conc });
  }
}
function moldar(enxLinhas, eqLinhas){
  const saida = { enxoval:{lojas:[],itens:[]}, coturno:{lojas:[],itens:[]}, equip:{lojas:[],itens:[]} };
  moldarTabela(enxLinhas, "enxoval", saida);   // aba Enxoval Unificado → enxoval + coturno (pela categoria)
  moldarTabela(eqLinhas,  "equip",  saida);    // aba Equipamentos/Acessórios
  return saida;
}

const gviz = gid => `https://docs.google.com/spreadsheets/d/${CFG.planilhaId}/gviz/tq?tqx=out:csv&gid=${gid}`;
async function lerCSV(gid){
  const r = await fetch(gviz(gid), {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status+" (gid "+gid+")");
  return csv(await r.text());
}

// Links de compra online (aba: Categoria | Produto | Link | Imagem — tudo em texto puro).
async function carregarOnline(){
  const linhas = await lerCSV(CFG.gid.online);
  const mapa = new Map();                       // categoria -> {nome, op:[...]}, preservando a ordem da planilha
  for(let r=1;r<linhas.length;r++){
    const ln = linhas[r] || [];
    const cat=String(ln[0]||"").trim(), t=String(ln[1]||"").trim(), u=String(ln[2]||"").trim(), img=String(ln[3]||"").trim();
    if(!cat || !/^https?:\/\//i.test(u)) continue;
    if(!mapa.has(cat)) mapa.set(cat, { nome:cat, op:[] });
    mapa.get(cat).op.push({ t: t||u, u, img: (fotoURL(img) || IMG_ONLINE[u] || "") });
  }
  return [...mapa.values()];
}

// Contatos das lojas (cabeçalho: Estado | Cidade/Município | Loja | Telefone | Instagram | Maps | Concurso (1) | Concurso (2)).
// Colunas localizadas pelo nome. Uma loja pode atender até 2 concursos; o filtro por concurso é feito na exibição (telaLojas).
// Cada loja: [nome, telefone, @instagram, urlInstagram, urlMaps, [concursos]].
async function carregarContatos(){
  const linhas = await lerCSV(CFG.gid.contatos);
  const header = linhas[0] || [];
  const iNome = acharCol(header, "Loja", "Nome");
  const iTel  = acharCol(header, "Telefone", "Tel");
  const iIns  = acharCol(header, "Instagram", "Insta");
  const iMaps = acharCol(header, "Maps", "Mapa", "Endereço", "Endereco");
  const iC1   = acharCol(header, "Concurso (1)", "Concurso 1", "Concurso");
  const iC2   = acharCol(header, "Concurso (2)", "Concurso 2");
  if(iNome<0) return [];                                        // cabeçalho inesperado → mantém snapshot
  const out=[];
  for(let r=1;r<linhas.length;r++){
    const ln = linhas[r] || [];
    const nome = String(ln[iNome]||"").trim(); if(!nome) continue;
    const tel = String(iTel>=0?ln[iTel]:"").replace(/^telefone[:\s]*/i,"").trim();
    let insta = String(iIns>=0?ln[iIns]:"").trim(), ig="";
    if(insta.startsWith("@")) ig = "https://www.instagram.com/"+insta.replace(/^@/,"").trim(); else insta="";
    let maps = String(iMaps>=0?ln[iMaps]:"").trim(); if(!/^https?:\/\//i.test(maps)) maps="";
    const concs = [iC1, iC2].map(i=> i>=0 ? String(ln[i]||"").trim() : "").filter(c=> IDS_CONCURSO.has(c));
    out.push([nome, tel, insta, ig, maps, concs]);
  }
  return out;
}

async function carregar(){
  try{
    const [enxLin, eqLin] = await Promise.all([ lerCSV(CFG.gid.enxoval), lerCSV(CFG.gid.equip) ]);
    const blocos = moldar(enxLin, eqLin);
    const n = Object.values(blocos).reduce((a,b)=>a+b.itens.length,0);
    if(n < 20) throw new Error("poucos itens lidos ("+n+")");
    DADOS = { ...SNAPSHOT, blocos };
    AO_VIVO = true;
  }catch(e){
    DADOS = SNAPSHOT;
    AO_VIVO = false;
    console.warn("Leitura ao vivo falhou — usando cópia local:", e.message);
  }
  try{
    const links = await carregarOnline();
    if(links.length) DADOS.links = links;       // links online ao vivo (fallback: snapshot)
  }catch(e){ console.warn("Links online ao vivo falharam — usando cópia local:", e.message); }
  try{
    const cts = await carregarContatos();
    if(cts.length) DADOS.contatos = cts;        // contatos ao vivo (inclui Maps; fallback: snapshot)
  }catch(e){ console.warn("Contatos ao vivo falharam — usando cópia local:", e.message); }
  desenhar();
}

const $ = s => document.querySelector(s);
const rs = v => "R$ " + Math.round(v).toLocaleString("pt-BR");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const idDe = it => (it.concurso||"") + "::" + it.bloco + "::" + it.nome;   // id separado por concurso

function todos(){                                             // itens do concurso selecionado, com id e bloco
  const out=[];
  for(const [chave,b] of Object.entries(DADOS.blocos))
    for(const it of b.itens){
      if(it.concurso !== E.concurso) continue;                // só o concurso selecionado na tela inicial
      const x = { ...it, bloco:chave }; x.id = idDe(x);
      out.push(x);
    }
  return out;
}
function visiveis(){ return todos(); }   // enxoval unificado — sem distinção de sexo

function melhor(it){
  let ln=null, pn=Infinity;
  for(const [l,p] of Object.entries(it.p)) if(p<pn){ pn=p; ln=l; }
  return { loja:ln, preco:pn };
}
const lojaDe = it => {
  const v = E.loja[it.id];
  return (v && it.p[v]) ? v : "";            // VAZIO por padrão; só preenche quando o usuário escolhe a loja
};
const qtdDe  = it => E.qtd[it.id] !== undefined ? E.qtd[it.id] : it.qtd;
const unDe   = it => it.p[lojaDe(it)] || 0;
const emCarrinho   = it => !!E.cart[it.id] && lojaDe(it)!=="" && qtdDe(it)>0;   // no carrinho (checkbox marcado + loja + qtd)
const lojaComprada = loja => !!E.compradoLoja[chaveLoja(loja)];                  // loja marcada como "já comprou" (por concurso)

// Totais do carrinho: total = tudo no carrinho; falta = no carrinho e ainda não comprado.
function resumo(lista){
  let total=0, falta=0, feitos=0, itens=0;
  for(const it of lista){
    if(!emCarrinho(it)) continue;
    itens++;
    const v=unDe(it)*qtdDe(it); total+=v;
    if(lojaComprada(lojaDe(it))) feitos++; else falta+=v;
  }
  return { total, falta, feitos, itens };
}

   Render — topo
   ========================================================================= */
const NOME_TELA = { calc:"Calculadora", carrinho:"Seu carrinho", lojas:"Lojas & pagamento", online:"Compras online", bizus:"Bizus do CFP" };

function topo(){
  const r = resumo(todos());
  const vazio = r.itens === 0;                     // nada no carrinho ainda
  const fim = r.itens && r.feitos===r.itens;       // tudo que está no carrinho já foi comprado
  $("#tTela").textContent = NOME_TELA[E.aba] || "";
  $("#tConcursoNome").textContent = infoConcurso()?.badge || "";
  const big=$("#tFalta"), lbl=$("#tLabel"), sub=$("#tSub"), b=$("#tBarra");
  if(vazio){
    big.textContent = "Monte seu orçamento";
    big.classList.add("cta");
    lbl.textContent = "";
    sub.innerHTML = "Escolha a loja e marque o <b>✓</b> para adicionar o item ao carrinho.";
    b.style.width = "0%"; b.classList.remove("full");
  } else {
    big.classList.remove("cta");
    big.textContent = fim ? "Tudo comprado" : rs(r.falta);
    lbl.textContent = fim ? "🎖" : "ainda a comprar";
    sub.innerHTML = `Carrinho <b>${rs(r.total)}</b> · ${r.itens} ${r.itens>1?"itens":"item"}${r.feitos?` · ${r.feitos} comprado${r.feitos>1?"s":""}`:""}`;
    const pct = r.itens ? Math.round(r.feitos/r.itens*100) : 0;
    b.style.width = pct+"%"; b.classList.toggle("full",fim);
  }
  $("#fPonto").className = "pt" + (AO_VIVO ? " viva" : "");
  $("#fTexto").textContent = AO_VIVO ? "Preços lidos da planilha agora" : "Cópia local — planilha não respondeu";
}

function chevron(){ return `<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>`; }

function itemHTML(it){
  const q=qtdDe(it), lj=lojaDe(it), un=it.p[lj]||0, inCart=emCarrinho(it), zer=q<=0, semLoja=lj==="";

        </div>
        <div class="sug num" title="Quantidade sugerida na planilha">sugerido: ${it.qtd}</div>
      </div>

      <div class="lbl">${ord.length} loja${ord.length>1?"s":""} · da mais barata p/ mais cara</div>

}

function telaCalc(){
  const its=visiveis(), por={};

/* =========================================================================
   Tela — Carrinho (itens agrupados pela loja escolhida na calculadora)
   ========================================================================= */
function carrinho(){                                  // derivado do estado (itens marcados no checkbox)
  const grupos = new Map();
  for(const it of todos()){
    if(!emCarrinho(it)) continue;                      // só entra quem foi adicionado pelo checkbox
    const lj = lojaDe(it), q = qtdDe(it), un = it.p[lj]||0;
    if(!grupos.has(lj)) grupos.set(lj, { loja:lj, itens:[], nItens:0, subtotal:0, comprada:lojaComprada(lj) });
    const g = grupos.get(lj);
    g.itens.push({ nome:it.nome, cat:it.cat, q, un, sub:un*q });
    g.nItens++; g.subtotal += un*q;
  }
  return [...grupos.values()];
}
function contatoDe(loja){                              // casa o nome da loja (preços) com a aba de contatos
  const cs = DADOS.contatos||[], L = loja.toLowerCase().trim();
  return cs.find(x=>x[0].toLowerCase().trim()===L)
      || cs.find(x=>x[0].toLowerCase().trim().startsWith(L))
      || cs.find(x=>{ const fw=x[0].toLowerCase().split(" ")[0]; return fw.length>2 && L.startsWith(fw); })
      || null;
}
// Loja que é site (não física) → em vez de contato, oferecemos "Consultar ofertas" na aba Online.
const LOJA_ONLINE = /mercado livre|mercadolivre|shopee|magazine|magalu|centauro|amazon|online/i;
const ehOnline = loja => LOJA_ONLINE.test(loja||"");

// Acha a categoria da aba Online que corresponde a um item da calculadora (por palavras-chave
// do nome + categoria do item contra o nome e as opções de cada categoria online).
function categoriaOnline(nomeItem, catItem){
  const links = DADOS.links||[];
  const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const stop = new Set(["para","padrao","enxoval","loja","online","pares","tamanhos","grandes","unidades","masculina","feminina","feminino","masculino"]);
  const toks = s => norm(s).split(/[^a-z0-9]+/).filter(w=>w.length>=4 && !stop.has(w));
  const alvo = toks(nomeItem+" "+(catItem||""));
  if(!alvo.length) return null;
  let best=null, bestSc=0;
  for(const l of links){
    const hay = new Set([...toks(l.nome), ...l.op.flatMap(o=>toks(o.t))]);
    let sc=0;
    for(const w of alvo){ for(const h of hay){ if(h===w || h.startsWith(w) || w.startsWith(h)){ sc++; break; } } }
    if(sc>bestSc){ bestSc=sc; best=l.nome; }
  }
  return bestSc>=1 ? best : null;
}

const REF_PLATAFORMA = "Vim por meio da plataforma Enxoval do Aprovado (enxovaldoaprovado.com.br)";
function msgWhats(g){
  const linhas = g.itens.map(i=>`• ${i.q}x ${i.nome}`).join("\n");
  const conc = infoConcurso()?.msg || "CFP";
  return `Olá! Sou do ${conc} e gostaria de comprar no(a) ${g.loja}:\n\n${linhas}\n\nPode me passar valores, formas de pagamento e disponibilidade? Obrigado(a)!\n\n${REF_PLATAFORMA}`;
}
function cardLojaCarrinho(g){
  const c = contatoDe(g.loja), online = ehOnline(g.loja);
  const mapsPin = (c&&c[4]) ? `<a class="mapsPin" href="${esc(c[4])}" target="_blank" rel="noopener" aria-label="Ver ${esc(g.loja)} no mapa" title="Ver no mapa">${svgMap()}</a>` : "";
  const itensHTML = g.itens.map(i=>{
    const cat = (online && !g.comprada) ? categoriaOnline(i.nome, i.cat) : null;
    const consultar = cat ? `<button class="consultar" data-cat="${esc(cat)}">Consultar ofertas
      <svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></button>` : "";
    return `<div class="ci"><span class="q num">${i.q}×</span>
      <span class="nmwrap"><span class="nm">${esc(i.nome)}</span>${consultar}</span>
      <span class="pv num">${rs(i.sub)}</span></div>`;
  }).join("");
  let acao = "";
  if(!g.comprada){
    if(c){
      const tel=(c[1]||"").replace(/\D/g,""), ig=c[3]||"";
      if(tel){
        acao=`<a class="abrir" data-wa="${esc(g.loja)}" data-valor="${g.subtotal}" data-itens="${g.nItens}" href="https://wa.me/55${tel}?text=${encodeURIComponent(msgWhats(g))}" target="_blank" rel="noopener">Enviar para ${esc(g.loja)}
          <svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></a>`;
        if(ig) acao+=`<a class="ig-link" href="${esc(ig)}" target="_blank" rel="noopener">ou falar pelo Instagram</a>`;
      } else if(ig){
        acao=`<a class="abrir" href="${esc(ig)}" target="_blank" rel="noopener">Abrir Instagram de ${esc(g.loja)}</a>`;
      } else if(online){
        acao=`<p class="lojaonline-nota">Loja online — toque em “Consultar ofertas” para comparar e comprar cada item.</p>`;
      }
    }
  }
  return `<div class="painel cart ${g.comprada?"comprada":""}">
    <div class="cabLoja"><span class="cnwrap"><span class="cn">${esc(g.loja)}</span>${mapsPin}</span><span class="cm num">${g.nItens} ${g.nItens>1?"itens":"item"} · ${rs(g.subtotal)}</span></div>
    <button class="jaComprou" role="checkbox" aria-checked="${g.comprada}" data-loja="${esc(g.loja)}"><span class="jbox"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>${g.comprada?"Comprado nesta loja":"Já comprei tudo desta loja"}</button>
    <div class="citens">${itensHTML}</div>
    ${acao}
  </div>`;
}

function telaCarrinho(){
  const grupos = carrinho();
  if(!grupos.length)
    return `<div class="vazio">

      <p><b>Seu carrinho está vazio.</b><br>Na calculadora, escolha a loja e marque o ✓ para adicionar os itens aqui.</p>
      <button class="voltarCalc">Ir para a calculadora</button>
    </div>`;
  const ativos = grupos.filter(g=>!g.comprada);
  const comprados = grupos.filter(g=>g.comprada);
  const totalAtivo = ativos.reduce((a,g)=>a+g.subtotal,0);
  const nAtivo = ativos.reduce((a,g)=>a+g.nItens,0);
  let h=`<div class="cartTotal"><div><div class="ct-l">Total do carrinho</div><div class="ct-s">${nAtivo} ${nAtivo!==1?"itens":"item"} em ${ativos.length} ${ativos.length!==1?"lojas":"loja"}</div></div><b class="num">${rs(totalAtivo)}</b></div>`;
  if(!ativos.length) h+=`<p class="hint" style="margin:0 16px 4px">Tudo o que estava no carrinho já foi marcado como comprado. 🎖</p>`;
  for(const g of ativos) h+=cardLojaCarrinho(g);
  if(comprados.length){
    h+=`<h2 class="grupo" style="margin-top:24px">Já comprados <span class="rt">${comprados.length} ${comprados.length>1?"lojas":"loja"}</span></h2>`;
    for(const g of comprados) h+=cardLojaCarrinho(g);
  }
  return h;
}

function desenhar(){
  // Tela inicial: só aparece quando não há concurso válido escolhido, ou ao "trocar concurso".
  if(telaInicial || !concursoValido(E.concurso)){
    document.body.classList.add("selecao");
    const tela=$("#tela"); tela.dataset.aba="selecao"; tela.innerHTML=telaSelecao();
    return;
  }
  document.body.classList.remove("selecao");
  if(!DADOS) return;
  const t=E.aba;
  $("#tela").dataset.aba = t;                                   // marca a aba p/ o CSS (grades no desktop)
  $("#tela").innerHTML =
    t==="carrinho" ? telaCarrinho() :
    t==="lojas" ? telaLojas() :
    t==="online" ? telaOnline() :
    t==="bizus" ? telaBizus() : telaCalc();
  document.querySelectorAll(".abas button").forEach(b=>b.setAttribute("aria-selected", b.dataset.t===t));
  const nc = carrinho().filter(g=>!g.comprada).reduce((a,g)=>a+g.nItens,0);   // conta só o que falta comprar
  const bd = $("#cartBadge"); if(bd){ bd.textContent = nc; bd.style.display = nc ? "grid" : "none"; }
  topo();
}

/* =========================================================================
   Navegação entre a tela de seleção e o app (com histórico do navegador)
   ========================================================================= */
// Entrar no app (após escolher o concurso): cria uma entrada de histórico,
// então o "voltar" do navegador retorna pra tela de seleção em vez de sair do site.
function abrirApp(){ telaInicial=false; history.pushState({v:"app"}, ""); desenhar(); window.scrollTo(0,0); }
// Voltar pra seleção ("trocar concurso"): usa o back do histórico quando dá, pra não empilhar entradas.
function voltarSelecao(){
  if(history.state && history.state.v==="app"){ history.back(); }
  else { telaInicial=true; history.pushState({v:"select"}, ""); desenhar(); window.scrollTo(0,0); }
}
// Botão voltar/avançar do navegador
window.addEventListener("popstate", ev => {
  const v = ev.state && ev.state.v;
  telaInicial = !(v==="app" && concursoValido(E.concurso));
  desenhar(); window.scrollTo(0,0);
});

/* =========================================================================
   Interação
   ========================================================================= */
document.addEventListener("click", ev => {
  // Tela inicial — escolher concurso
  const opt = ev.target.closest(".conc-opt");
  if(opt){
    const id=opt.dataset.conc;
    if(concursoValido(id)){ E.concurso=id; salvar(); track("selecao_concurso",{concurso:id}); abrirApp(); }
    return;
  }
  // Selo do topo — voltar pra tela de seleção ("trocar concurso")
  if(ev.target.closest("#tConcurso")){ voltarSelecao(); return; }

  const aba = ev.target.closest(".abas button");
  if(aba){ E.aba=aba.dataset.t; salvar(); desenhar(); window.scrollTo(0,0); return; }

  if(ev.target.closest(".voltarCalc")){ E.aba="calc"; salvar(); desenhar(); window.scrollTo(0,0); return; }

  const wa = ev.target.closest("a[data-wa]");
  if(wa) track("whatsapp_click", { loja:wa.dataset.wa, valor:+wa.dataset.valor||0, itens:+wa.dataset.itens||0 });  // sem return: o link segue abrindo

  const cons = ev.target.closest(".consultar");
  if(cons){
    const cat = cons.dataset.cat;
    track("consultar_ofertas", { categoria:cat });
    E.aba="online"; salvar(); desenhar();
    requestAnimationFrame(()=>{
      const el = [...document.querySelectorAll("#tela .card")].find(c=>c.dataset.cat===cat);
      if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); el.classList.add("destaque"); setTimeout(()=>el.classList.remove("destaque"),1800); }
      else window.scrollTo(0,0);
    });
    return;
  }

  const jc = ev.target.closest(".jaComprou");
  if(jc){ const k=chaveLoja(jc.dataset.loja); E.compradoLoja[k]=!E.compradoLoja[k]; salvar(); desenhar(); return; }

  const fer = ev.target.closest(".ferbtn");
  if(fer){
    const act = fer.dataset.act;
    const alvos = todos().filter(it=>qtdDe(it)>0);
    if(act==="tudo"){
      const todosSel = alvos.length>0 && alvos.every(emCarrinho);
      if(todosSel){ for(const it of alvos) E.cart[it.id]=false; }                    // desmarca tudo (mantém as lojas)
      else { for(const it of alvos){ if(lojaDe(it)==="") E.loja[it.id]=melhor(it).loja; if(!E.cart[it.id]){ E.cart[it.id]=true; track("add_ao_carrinho",{loja:lojaDe(it), item:it.nome, valor:unDe(it)*qtdDe(it), qtd:qtdDe(it), via:"selecionar_tudo"}); } } }
    } else if(act==="baratas"){
      for(const it of alvos) E.loja[it.id]=melhor(it).loja;                          // só designa a mais barata, sem mexer no carrinho
    } else if(act==="limpar"){
      if(!confirm("Isso zera as lojas escolhidas, o carrinho e as marcações de “já comprou”. As quantidades continuam. Continuar?")) return;
      E.loja={}; E.cart={}; E.compradoLoja={};
    }
    salvar(); desenhar(); window.scrollTo(0,0); return;
  }

  const art = ev.target.closest(".item");
  if(!art) return;
  const id = art.dataset.id;
  const it = visiveis().find(x=>x.id===id); if(!it) return;

  if(ev.target.closest(".tick")){
    if(lojaDe(it)===""){ art.classList.add("aberto"); return; }   // sem loja → abre a lista pra escolher primeiro
    E.cart[id]=!E.cart[id];                                        // checkbox = adicionar/remover do carrinho
    if(E.cart[id]) track("add_ao_carrinho", { loja:lojaDe(it), item:it.nome, valor:unDe(it)*qtdDe(it), qtd:qtdDe(it) });
    salvar(); desenhar(); return;
  }

  const passo = ev.target.closest(".step button");
  if(passo){ E.qtd[id]=Math.max(0, qtdDe(it) + (+passo.dataset.d)); salvar(); desenhar(); return; }

  const lj = ev.target.closest(".lj");
  if(lj){ const nova=lj.dataset.loja; E.loja[id] = (E.loja[id]===nova) ? "" : nova; salvar(); desenhar(); return; }  // toca de novo p/ limpar

  if(ev.target.closest(".lojaBtn") || ev.target.closest(".nome")){ art.classList.toggle("aberto"); return; }
});
