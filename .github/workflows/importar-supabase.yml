name: Importar planilha -> Supabase

# Roda a importação Sheets -> Supabase automaticamente (na nuvem, sem depender
# do computador). Também dá para rodar na mão pelo botão "Run workflow".
#
# Raspagem dos preços do Mercado Livre (grava na planilha ANTES de importar):
#  * todo dia, na execução agendada das 05:41 (Brasília) — cron "41 8 * * *";
#  * no "Run workflow" manual, se a opção estiver marcada.
# As demais execuções agendadas só importam (leve).
# Obs.: o GitHub atrasa/pula execuções agendadas em horário cheio; por isso os
# minutos "quebrados". Na prática a de hora em hora roda ~3-4x por dia.
on:
  schedule:
    - cron: "17 * * * *"     # de hora em hora (:17, horário UTC) — só importa
    - cron: "41 8 * * *"     # todo dia 08:41 UTC = 05:41 Brasília — raspa o ML e importa
  workflow_dispatch:          # execução manual pela aba Actions
    inputs:
      atualizar_precos:
        description: "Raspar preços do Mercado Livre na planilha antes de importar?"
        type: boolean
        default: true

# não deixa duas importações rodarem ao mesmo tempo
concurrency:
  group: importar-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ---- Raspagem de preços (diária às 05:41 BRT, ou no Run workflow manual se marcado) ----
      - name: Instalar dependências do bot de preços
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.atualizar_precos) || github.event.schedule == '41 8 * * *' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r bot-precos/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar credencial do Google (a partir do secret)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.atualizar_precos) || github.event.schedule == '41 8 * * *' }}
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "::error::Secret GOOGLE_CREDENTIALS_JSON não configurado. Veja bot-precos/README.md."
            exit 1
          fi
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > bot-precos/credenciais.json

      - name: Atualizar preços (Mercado Livre) na planilha
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.atualizar_precos) || github.event.schedule == '41 8 * * *' }}
        working-directory: bot-precos
        run: python atualizar_precos.py

      - name: Apagar credencial do Google (sempre)
        if: always()
        run: rm -f bot-precos/credenciais.json

      # ---- Importação (SEMPRE roda: cron e manual) ----
      - name: Importar (planilha -> Supabase)
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: python3 migracao/migrate_supabase.py
