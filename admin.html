<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administração · Enxoval do Aprovado</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#22291A">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="painel.css?v=1">
<style>
/* só da administração */
main{max-width:980px}
.topo .in{max-width:980px}
select{font:inherit}
.convite{display:flex;flex-direction:column;gap:10px}
.convite h3{margin:0}
.convite .linha{display:flex;flex-direction:column;gap:8px}
.convite .btn{min-height:44px}
.convite .obs{font-size:12.5px;color:var(--ink3);margin:0}
.membro{display:flex;align-items:center;gap:12px;padding:12px;border-top:1px solid var(--rule2)}
.membro:first-child{border-top:0}
.membro .meio{flex:1;min-width:0}
.membro .nome{font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.membro .nome small{color:var(--ink3);font-weight:500}
.membro .ref{font-size:12.5px;color:var(--ink3);margin-top:2px}
.membro .ref .pend{color:var(--fogo-d);font-weight:600}
.membro .acoes{flex:none;display:flex;align-items:center;gap:4px}
.membro .acoes select{min-height:38px;border:1px solid var(--rule);border-radius:9px;padding:6px 8px;background:#fff;color:var(--ink);font-size:14px}
.membro .rem{font-size:13px;color:var(--erro)}
.tag.dono{color:var(--fogo-d)}
.tag.ler{color:var(--ink2)}
/* aba Dados (somente leitura) */
.subs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.subs::-webkit-scrollbar{display:none}
.subs button{flex:none;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.subs button[aria-pressed="true"]{background:var(--fogo);border-color:var(--fogo);color:#fff}
.reg{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border-top:1px solid var(--rule2)}
.lista>.reg:first-child,.lista>details:first-child>summary.reg{border-top:0}
.reg img,.reg .ph{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#F6F5F0;flex:none}
.reg .meio{flex:1;min-width:0}
.reg .nome{font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.reg .ref{font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.4}
.reg .ref b{color:var(--ink2);font-weight:600}
.reg .ref a{color:var(--ink2)}
.reg .dir{flex:none;text-align:right;font-size:13px;color:var(--ink2);white-space:nowrap}
.reg .dir b{display:block;font-size:15px;color:var(--ink)}
.tags{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:1px}
.tag.ini{color:var(--fogo-d)} .tag.azul{color:#3E6A8A}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{background:#FAF9F5}
.det{padding:4px 12px 12px 68px;font-size:13.5px;background:#FAF9F5}
.det table{width:100%;border-collapse:collapse}
.det td{padding:5px 0;border-top:1px solid var(--rule2)}
.det td.n{text-align:right;white-space:nowrap;padding-left:10px}
.det .off,.reg .off{color:var(--ink3)}
.aviso-ed{font-size:12.5px;color:var(--ink3);margin:14px 2px 20px}
/* formulário de edição (etapa 5) */
.form-ed{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 14px;margin:0 0 16px}
.form-ed h2{font-family:Archivo,system-ui,sans-serif;font-size:18px;font-weight:800;margin:0 0 14px}
.form-ed .grade{display:grid;grid-template-columns:1fr;gap:12px}
.form-ed .campo input,.form-ed .campo select{width:100%;min-height:44px;border:1px solid var(--rule);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);font:inherit}
.form-ed .campo select:focus{outline:2px solid var(--fogo);border-color:var(--fogo)}
.form-ed .campo small{display:block;font-size:12px;color:var(--ink3);margin-top:3px}
.form-ed .check{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600;color:var(--ink2);min-height:44px;cursor:pointer}
.form-ed .check input{width:20px;height:20px;accent-color:var(--fogo);flex:none}
.form-ed .multi{border:1px solid var(--rule);border-radius:10px;padding:6px 12px 8px;margin:0}
.form-ed .multi legend{font-size:13px;font-weight:600;color:var(--ink2);padding:0 4px}
.form-ed .multi .check{min-height:38px;font-weight:500}
.form-ed .acoes-ed{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.form-ed .acoes-ed .btn{min-height:44px}
.form-ed .acoes-ed .excluir{margin-left:auto;background:transparent;color:var(--erro);border:1px solid #E7B9B5}
.btn-ed{flex:none;border:1px solid var(--rule);background:#fff;color:var(--ink2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn-ed:hover{border-color:var(--fogo);color:var(--fogo-d)}
.resumo .btn-ed{margin-left:auto;background:var(--fogo);border-color:var(--fogo);color:#fff}
@media (min-width:700px){ .form-ed .grade{grid-template-columns:1fr 1fr} .form-ed .largo{grid-column:1/-1} }
.faixa-ed{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#3F5A24;background:#EEF3E7;border-radius:9px;padding:8px 11px;margin:0 0 12px}
.faixa-ed::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--feito);flex:none}
.cupom{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 13px;margin:0 0 10px}
.cupom .cod{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-weight:700;font-size:18px;letter-spacing:.04em}
.cupom p{margin:4px 0 0;font-size:13.5px;color:var(--ink2)}
.cupom ul{margin:8px 0 0;padding-left:18px;font-size:13.5px}
@media (max-width:520px){
  .det{padding-left:12px}
  .membro{flex-wrap:wrap}
  .membro .acoes{width:100%;justify-content:space-between}
}
@media (min-width:700px){
  .convite .linha{flex-direction:row}
  .convite .linha input{flex:1 1 auto}
  .convite .linha select{flex:0 0 170px;width:auto}
}
</style>
</head>
<body>
<header class="topo">
  <div class="in">
    <div class="marca"><img src="logo.png" alt=""><span class="mk">Enxoval<small>Administração</small></span></div>
    <div class="loja" id="hLoja" hidden><b id="hLojaNome"></b><span></span></div>
    <button class="sair" id="btnSair" hidden>Sair</button>
  </div>
</header>
<main id="tela"><p class="vazio">Carregando…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="painel-comum.js?v=1"></script>
<script>
/* =========================================================================
   Painel administrativo do Enxoval do Aprovado (equipe).
   Acesso: conta listada em `admins` (migracao/07_admin.sql + 08_equipe.sql).
   Papéis: proprietario (definido no SQL) · admin · leitor.
   Convites/remoção pela Edge Function `equipe` (supabase/functions/equipe).
   A segurança está no banco/função: esta página só mostra e pede.
   ========================================================================= */
const PAPEL = { proprietario: "Proprietário", admin: "Administrador", leitor: "Leitor" };
const dataBR = iso => iso ? new Date(iso).toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", year:"2-digit" }) : "";

const A = {
  eu: null,            // { id, email }
  papel: null,         // proprietario | admin | leitor
  aba: "metricas",     // metricas | equipe
  equipe: null         // lista de listar_equipe()
};
const ehDono = () => A.papel === "proprietario";

function cabecalho(logado){
  $("#btnSair").hidden = !logado;
  $("#hLoja").hidden = !logado || !A.papel;
  if(A.papel){ $("#hLojaNome").textContent = A.eu?.email || ""; $("#hLoja span").textContent = PAPEL[A.papel]; }
}

/* ---------------- telas de acesso ---------------- */
function telaLogin(msg){
  cabecalho(false);
  $("#tela").innerHTML = `
    <div class="cartao">
      <div class="cab"><h1>Entrar</h1><p>Acesso restrito à equipe do Enxoval do Aprovado.</p></div>
      <form id="fLogin" novalidate>
        ${msg ? `<p class="msg ${msg.tipo}">${esc(msg.txt)}</p>` : ""}
        <label class="campo"><span>E-mail</span><input name="email" type="email" autocomplete="username" inputmode="email" required></label>
        <label class="campo"><span>Senha</span><input name="senha" type="password" autocomplete="current-password" required></label>
        <button class="btn fogo" type="submit">Entrar</button>
        <button class="link" type="button" id="lnkEsqueci">Esqueci minha senha</button>
      </form>
    </div>`;
  $("#fLogin").addEventListener("submit", async ev=>{
    ev.preventDefault();
    const f = ev.target, b = f.querySelector("button[type=submit]");
    b.disabled = true; b.textContent = "Entrando…";
    const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.senha.value });
    if(error){ telaLogin({ tipo:"erro", txt: /invalid/i.test(error.message) ? "E-mail ou senha incorretos." : "Não foi possível entrar agora. Tente de novo." }); return; }
    iniciar();
  });
  $("#lnkEsqueci").addEventListener("click", telaEsqueci);
  requestAnimationFrame(()=>{ const i=$("#fLogin input"); if(i) i.focus(); });
}
function telaEsqueci(){
  $("#tela").innerHTML = `
    <div class="cartao">
      <div class="cab"><h1>Recuperar senha</h1><p>Enviamos um link para você criar uma senha nova.</p></div>
      <form id="fEsq" novalidate>
        <label class="campo"><span>E-mail da conta</span><input name="email" type="email" autocomplete="username" inputmode="email" required></label>
        <button class="btn fogo" type="submit">Enviar link</button>
        <button class="link" type="button" id="lnkVoltar">Voltar</button>
      </form>
    </div>`;
  $("#fEsq").addEventListener("submit", async ev=>{
    ev.preventDefault();
    const b = ev.target.querySelector("button[type=submit]"); b.disabled = true; b.textContent = "Enviando…";
    await sb.auth.resetPasswordForEmail(ev.target.email.value.trim(), { redirectTo: location.origin + location.pathname });
    telaLogin({ tipo:"ok", txt:"Se esse e-mail tiver conta, você vai receber o link em alguns minutos." });
  });
  $("#lnkVoltar").addEventListener("click", ()=>telaLogin());
}
// convite (primeira senha) ou recuperação (senha nova)
function telaNovaSenha(){
  const conv = LINK_EMAIL.tipo === "invite";
  cabecalho(true);
  $("#tela").innerHTML = `
    <div class="cartao">
      <div class="cab"><h1>${conv ? "Bem-vindo à equipe" : "Nova senha"}</h1><p>${conv ? "Crie sua senha para entrar. " : ""}Mínimo de 8 caracteres.</p></div>
      <form id="fNova" novalidate>
        <p class="msg erro" id="novaErro" hidden></p>
        <label class="campo"><span>Senha</span><input name="s1" type="password" autocomplete="new-password" minlength="8" required></label>
        <label class="campo"><span>Repita a senha</span><input name="s2" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn fogo" type="submit">Salvar senha</button>
      </form>
    </div>`;
  $("#fNova").addEventListener("submit", async ev=>{
    ev.preventDefault();
    const f = ev.target, e = $("#novaErro");
    if(f.s1.value.length < 8){ e.textContent = "A senha precisa ter pelo menos 8 caracteres."; e.hidden = false; return; }
    if(f.s1.value !== f.s2.value){ e.textContent = "As senhas não são iguais."; e.hidden = false; return; }
    const b = f.querySelector("button[type=submit]"); b.disabled = true;
    const { error } = await sb.auth.updateUser({ password: f.s1.value });
    b.disabled = false;
    if(error){ e.textContent = "Não foi possível salvar a senha. Peça um novo link."; e.hidden = false; return; }
    definindoSenha = false; LINK_EMAIL.tipo = null;
    aviso("Senha salva."); iniciar();
  });
}
function telaAviso(titulo, txt){
  cabecalho(true);
  $("#tela").innerHTML = `<div class="cartao"><div class="cab"><h1>${esc(titulo)}</h1><p>${esc(txt)}</p></div></div>`;
}

function abasHTML(){
  return `<div class="abas" role="tablist">${[["metricas","Métricas"],["dados","Dados"],["equipe","Equipe"]].map(([k,t])=>
    `<button role="tab" data-aba="${k}" aria-selected="${A.aba===k}">${t}</button>`).join("")}</div>`;
}
function abrirAba(){ A.aba === "equipe" ? abrirEquipe() : A.aba === "dados" ? abrirDados() : abrirMetricas(); }

/* ---------------- aba Métricas (todas as lojas) ---------------- */
const ADM = { lojas: [], loja: "", preset: 30, ini: "", fim: "", met: null, pedido: 0 };
function periodoPreset(d){ ADM.preset = d; ADM.fim = hojeBR(); ADM.ini = somaDias(ADM.fim, -(d - 1)); }
const ab = (longo, curto) => `<span class="longo">${longo}</span><span class="curto">${curto}</span>`;   // rótulo curto no celular
function rankingHTML(m){
  const ls = m.lojas || [];
  if(!ls.length) return "";
  return `<div class="bloco"><h3>Por loja</h3><div class="rolar"><table class="tab lojas">
    <thead><tr><th>Loja</th><th class="n" title="WhatsApp">${ab("WhatsApp","Zap")}</th><th class="n" title="Carrinho">${ab("Carrinho","Carr.")}</th><th class="n">PDF</th><th class="n" title="Contatos">${ab("Contatos","Cont.")}</th><th class="n larga">Pessoas</th></tr></thead><tbody>
    ${ls.map(l=>`<tr data-loja="${esc(l.id)}" title="Ver só ${esc(l.nome)}"><td>${esc(l.nome)}${l.parceira ? ` <span class="tag">parceira</span>` : ""}${l.ativo ? "" : ` <span class="tag off">desativada</span>`}
        ${l.valor_whatsapp ? `<small>${brl(Math.round(l.valor_whatsapp))}<span class="longo"> em orçamentos</span></small>` : ""}</td>
      <td class="n num">${inteiro(l.whatsapp)}</td><td class="n num">${inteiro(l.carrinho)}</td><td class="n num">${inteiro(l.pdf)}</td><td class="n num">${inteiro(l.contato)}</td><td class="n num larga">${inteiro(l.pessoas)}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}
function telaMetricas(){
  cabecalho(true);
  const loja = ADM.lojas.find(l=>l.id===ADM.loja), m = ADM.met;
  let h = abasHTML() + `<div class="resumo"><h1>${loja ? esc(loja.nome) : "Métricas gerais"}</h1>${m ? `<span class="cont num">${pessoasTxt(m.pessoas)} interagiram com ${loja ? "a loja" : "as lojas"}</span>` : ""}</div>
    <div class="filtros">
      <select class="sel" id="admLoja" aria-label="Loja"><option value="">Todas as lojas</option>
        ${ADM.lojas.map(l=>`<option value="${esc(l.id)}" ${l.id===ADM.loja?"selected":""}>${esc(l.nome)}${l.parceira?" · parceira":""}${l.ativo?"":" (desativada)"}</option>`).join("")}</select>
      <div class="concs" role="group" aria-label="Período">${[7,30,90].map(d=>`<button data-dias="${d}" aria-pressed="${ADM.preset===d}">${d} dias</button>`).join("")}</div>
      <div class="datas"><label>De <input type="date" id="admIni" value="${ADM.ini}" max="${ADM.fim}"></label>
        <label>Até <input type="date" id="admFim" value="${ADM.fim}" min="${ADM.ini}" max="${hojeBR()}"></label></div>
    </div>`;
  if(loja) h += `<button class="link voltar" id="admTodas">← Todas as lojas</button>`;
  h += m ? corpoMetricas(m, true, loja ? "" : rankingHTML(m)) : `<p class="vazio">Carregando…</p>`;
  $("#tela").innerHTML = h;
}
async function abrirMetricas(){
  if(!ADM.lojas.length){ const { data } = await sb.from("lojas").select("id, nome, parceira, ativo").order("nome"); ADM.lojas = data || []; }
  if(!ADM.ini) periodoPreset(30);
  const pedido = ++ADM.pedido;                    // ignora respostas de filtros já trocados
  ADM.met = null; telaMetricas();
  const { data, error } = await sb.rpc("metricas_admin", { p_inicio: ADM.ini, p_fim: ADM.fim, p_loja: ADM.loja || null });
  if(pedido !== ADM.pedido || A.aba !== "metricas") return;
  if(error || !data){ console.warn(error); aviso(error ? "Não foi possível carregar as métricas." : "Período inválido (máximo de 366 dias).", true); return; }
  ADM.met = data; telaMetricas();
}

/* ---------------- aba Equipe ---------------- */
function membroHTML(m){
  const voce = m.user_id === A.eu.id;
  const ref = m.pendente ? `<span class="pend">Convite pendente</span> · enviado em ${dataBR(m.criado_em)}`
                         : `Último acesso em ${dataBR(m.ultimo_acesso)}`;
  let acoes;
  if(ehDono() && m.papel !== "proprietario"){
    acoes = `<select data-papel="${esc(m.user_id)}" aria-label="Papel de ${esc(m.email)}">
        ${["admin","leitor"].map(p=>`<option value="${p}" ${m.papel===p?"selected":""}>${PAPEL[p]}</option>`).join("")}</select>
      <button class="link rem" data-remover="${esc(m.user_id)}" title="Tirar o acesso de ${esc(m.email)}">Remover</button>`;
  } else {
    acoes = `<span class="tag ${m.papel==="proprietario"?"dono":m.papel==="leitor"?"ler":""}">${PAPEL[m.papel]}</span>`;
  }
  return `<div class="membro"><div class="meio"><div class="nome">${esc(m.email)}${voce ? ` <small>(você)</small>` : ""}</div>
    <div class="ref">${ref}</div></div><div class="acoes">${acoes}</div></div>`;
}
function telaEquipe(){
  cabecalho(true);
  const eq = A.equipe;
  let h = abasHTML() + `<div class="resumo"><h1>Equipe</h1>${eq ? `<span class="cont num">${eq.length} pessoa${eq.length!==1?"s":""}</span>` : ""}</div>`;
  if(ehDono()) h += `
    <form class="bloco convite" id="fConvite" novalidate>
      <h3>Convidar</h3>
      <div class="linha">
        <input class="sel" name="email" type="email" inputmode="email" autocomplete="off" placeholder="E-mail" aria-label="E-mail" required>
        <select class="sel" name="papel" aria-label="Papel"><option value="leitor">Leitor</option><option value="admin">Administrador</option></select>
        <button class="btn fogo" type="submit">Convidar</button>
      </div>
      <p class="obs">Administrador altera os dados; leitor só visualiza. A pessoa recebe um e-mail para criar a senha.</p>
    </form>`;
  h += eq ? `<div class="lista">${eq.map(membroHTML).join("")}</div>` : `<p class="vazio">Carregando…</p>`;
  if(eq && !ehDono()) h += `<p class="nota" style="margin-top:12px">Só o proprietário convida e altera papéis.</p>`;
  $("#tela").innerHTML = h;
}
async function abrirEquipe(){
  A.equipe = null; telaEquipe();
  const { data, error } = await sb.rpc("listar_equipe");
  if(A.aba !== "equipe") return;
  if(error){ console.warn(error); aviso("Não foi possível carregar a equipe.", true); return; }
  A.equipe = data || []; telaEquipe();
}
// chama a Edge Function e devolve { ok, erro, ... }
async function equipeFn(corpo){
  const { data, error } = await sb.functions.invoke("equipe", { body: corpo });
  if(!error) return data;
  try{ return await error.context.json(); }catch{ return { erro: "Não foi possível falar com o servidor." }; }
}

/* ---------------- aba Dados (somente leitura — etapa 3 do backend) ----------------
   Mostra o que está no Supabase (vindo da planilha pela importação). A edição entra na etapa 5. */
const D = { sub: "concursos", cache: {}, conc: "", busca: "", tipo: "" };
// Edição (etapa 5): só com a trava em 'painel' (status_edicao(), 11/12_*.sql) e papel proprietário/administrador.
// Com a trava em 'planilha' a aba Dados fica exatamente como antes (somente leitura).
const ED = { fonte: "planilha", ate: null, timer: 0 };
const podeEditar = () => (A.papel === "proprietario" || A.papel === "admin") && ED.fonte === "painel"
                         && (!ED.ate || new Date(ED.ate) > new Date());
async function lerStatusEdicao(){
  const { data, error } = await sb.rpc("status_edicao");
  if(error){ ED.fonte = "planilha"; ED.ate = null; return; }        // função ausente/erro = somente leitura
  ED.fonte = data?.fonte || "planilha"; ED.ate = data?.liberado_ate || null;
  clearTimeout(ED.timer);
  if(ED.ate){                                                       // prazo da janela: ao vencer, volta a somente leitura
    const ms = new Date(ED.ate) - new Date();
    if(ms > 0) ED.timer = setTimeout(()=>{ ED.fonte = "planilha"; ED.ate = null; if(A.aba === "dados") telaDados(); }, ms + 1000);
  }
}
const horaBR = iso => new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
const faixaEd = () => podeEditar() ? `<div class="faixa-ed">${ED.ate ? `Edição liberada até ${horaBR(ED.ate)}` : "Edição pelo painel ativa"}</div>` : "";
const SUBS = [["concursos","Concursos"],["itens","Itens"],["lojas","Lojas"],["online","Online"],["cupons","Cupons"],["bizus","Bizus"]];
const CONSULTAS = {
  concursos: () => sb.from("concursos").select("id, nome, estado, ativo, itens_iniciais, rotulo, ano, selo, msg_whatsapp, descricao, ordem, itens_enxoval(count), loja_concurso(count)"),
  itens:     () => sb.from("itens_enxoval").select("id, nome_padronizado, categoria, qtd_sugerida, link_foto, item_inicial, feminino, produto_online_id, concurso_id, precos(preco, lojas(nome, ativo, parceira))"),
  lojas:     () => sb.from("lojas").select("id, nome, tipo, telefone, instagram, link_maps, ativo, parceira, estado, cidade, loja_concurso(concurso_id, concursos(nome)), precos(count)"),
  online:    () => sb.from("produtos_online").select("id, categoria, nome, link_produto, link_imagem, preco, ativo, lojas(nome, ativo), itens_enxoval(concursos(nome)), cupom_produtos(cupons(codigo, ativo))"),
  bizus:     () => sb.from("bizus").select("id, concurso_id, categoria, titulo, link, ordem, ativo").order("ordem"),
  cupons:    () => sb.from("cupons").select("id, codigo, texto, ativo, lojas(nome), cupom_produtos(produtos_online(nome)), cupom_itens(itens_enxoval(nome_padronizado, concursos(nome)))")
};
const ordConc = (a, b) => (a.ordem ?? 99) - (b.ordem ?? 99) || a.nome.localeCompare(b.nome);
const nInt = r => (r && r[0] && r[0].count) || 0;
const qtdTxt = q => q == null ? "—" : q === 0 ? "a critério" : `${q}×`;
const foto = (u, alt) => u ? `<img src="${esc(u)}" alt="${esc(alt||"")}" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph'}))">` : `<div class="ph"></div>`;
const tag = (txt, cls) => `<span class="tag ${cls||""}">${esc(txt)}</span>`;
const bate = (...txt) => !D.busca || norm(txt.join(" ")).includes(norm(D.busca));

async function dados(sub){
  if(D.cache[sub]) return D.cache[sub];
  const pedidos = [CONSULTAS[sub]()];
  if(sub === "itens" || sub === "bizus") pedidos.push(dados("concursos"));
  const [r] = await Promise.all(pedidos);
  if(r.error) throw r.error;
  return (D.cache[sub] = r.data || []);
}
function subsHTML(){
  return `<div class="subs" role="group" aria-label="Tipo de dado">${SUBS.map(([k,t])=>
    `<button data-sub="${k}" aria-pressed="${D.sub===k}">${t}</button>`).join("")}</div>`;
}
const buscaHTML = ph => `<input class="busca" id="dBusca" type="search" placeholder="${ph}" value="${esc(D.busca)}" aria-label="${ph}">`;
const avisoEd = () => podeEditar() ? "" : `<p class="aviso-ed">Somente leitura. Por enquanto as mudanças são feitas na planilha e chegam aqui na importação automática.</p>`;

/* ---- formulário genérico de edição (etapa 5). Grava SÓ pelas funções admin_* do banco (11_escrita.sql),
   que conferem permissão, trava e validações; a tela só mostra a mensagem que o banco devolver. ---- */
const FORMS = {
  concurso: {
    rotulo: "concurso", fem: false, cache: ["concursos", "itens", "bizus"], novo: { ativo: false },
    salvar: "admin_salvar_concurso", excluir: "admin_excluir_concurso",
    campos: [
      { k: "nome", rot: "Nome", req: true, ph: "CBMDF - 2025", largo: true, ajuda: "Igual ao usado nas abas da planilha." },
      { k: "rotulo", rot: "Texto do botão", ph: "CBMDF" },
      { k: "ano", rot: "Ano no botão", ph: "2025" },
      { k: "selo", rot: "Selo no topo do site", ph: "CBMDF" },
      { k: "estado", rot: "Estado", ph: "Distrito Federal" },
      { k: "descricao", rot: "Descrição", ph: "Corpo de Bombeiros Militar do DF", largo: true },
      { k: "msg_whatsapp", rot: "Mensagem às lojas: “Sou do …”", ph: "CFP CBMDF 2026", largo: true },
      { k: "ordem", rot: "Ordem na tela inicial", tipo: "number", ph: "1" },
      { k: "ativo", rot: "Ativo (aparece no site)", tipo: "check" },
      { k: "itens_iniciais", rot: "Botão “Itens iniciais”", tipo: "check" }
    ]
  },
  loja: {
    rotulo: "loja", fem: true, cache: ["lojas", "concursos", "itens", "online", "cupons"], novo: { tipo: "fisica", ativo: true },
    salvar: "admin_salvar_loja", excluir: "admin_excluir_loja",
    antes: async () => { await dados("concursos"); },                          // opções de concursos atendidos
    prep: l => ({ ...l, concursos: (l.loja_concurso || []).map(x => x.concurso_id) }),
    campos: [
      { k: "nome", rot: "Nome", req: true, ph: "Demir Fardas Militares", largo: true, ajuda: "Igual ao da aba Contatos da planilha." },
      { k: "tipo", rot: "Tipo", tipo: "select", opcoes: () => [["fisica", "Loja física"], ["online", "Loja online"]] },
      { k: "telefone", rot: "WhatsApp / telefone", ph: "61 98765-4321", ajuda: "Com DDD." },
      { k: "instagram", rot: "Instagram", ph: "@perfil" },
      { k: "link_maps", rot: "Link do mapa", ph: "https://maps.google.com/…" },
      { k: "cidade", rot: "Cidade", ph: "Brasília" },
      { k: "estado", rot: "Estado", ph: "Distrito Federal" },
      { k: "concursos", rot: "Concursos que atende", tipo: "multi", largo: true,
        opcoes: () => (D.cache.concursos || []).slice().sort(ordConc).map(c => [c.id, c.nome + (c.ativo ? "" : " (desativado)")]) },
      { k: "ativo", rot: "Ativa (aparece no site)", tipo: "check" },
      { k: "parceira", rot: "Parceira (preços pelo painel da loja)", tipo: "check" }
    ]
  }
};
function campoHTML(c, v){
  const id = "ed_" + c.k, cls = c.largo ? "largo" : "";
  if(c.tipo === "multi"){
    const marc = new Set(v || []);
    return `<fieldset class="multi ${cls}" id="${id}"><legend>${esc(c.rot)}</legend>
      ${c.opcoes().map(([val, txt]) => `<label class="check"><input type="checkbox" value="${esc(val)}" ${marc.has(val) ? "checked" : ""}> ${esc(txt)}</label>`).join("")
        || `<small>Nenhuma opção.</small>`}</fieldset>`;
  }
  if(c.tipo === "check")
    return `<label class="check ${cls}"><input type="checkbox" id="${id}" data-k="${c.k}" ${v ? "checked" : ""}> ${esc(c.rot)}</label>`;
  if(c.tipo === "select")
    return `<label class="campo ${cls}"><span>${esc(c.rot)}${c.req ? " *" : ""}</span><select id="${id}" data-k="${c.k}">
      ${c.opcoes().map(([val, txt]) => `<option value="${esc(val)}" ${String(v ?? "") === String(val) ? "selected" : ""}>${esc(txt)}</option>`).join("")}</select>
      ${c.ajuda ? `<small>${esc(c.ajuda)}</small>` : ""}</label>`;
  return `<label class="campo ${cls}"><span>${esc(c.rot)}${c.req ? " *" : ""}</span>
    <input id="${id}" data-k="${c.k}" type="${c.tipo === "number" ? "number" : "text"}" ${c.tipo === "number" ? 'inputmode="numeric"' : ""}
      value="${esc(v ?? "")}" placeholder="${esc(c.ph || "")}" ${c.req ? "required" : ""} autocomplete="off">
    ${c.ajuda ? `<small>${esc(c.ajuda)}</small>` : ""}</label>`;
}
function formHTML(){
  const f = FORMS[D.form.ent], v = D.form.dados || {};
  return `<form class="form-ed" id="fEd" novalidate>
    <h2>${D.form.id ? "Editar " : "Novo "}${f.rotulo}</h2>
    <div class="grade">${f.campos.map(c => campoHTML(c, v[c.k])).join("")}</div>
    <div class="acoes-ed">
      <button class="btn fogo" type="submit">Salvar</button>
      <button class="btn ghost" type="button" id="edCancelar">Cancelar</button>
      ${D.form.id && f.excluir ? `<button class="btn excluir" type="button" id="edExcluir">Excluir</button>` : ""}
    </div></form>`;
}
function lerForm(){
  const f = FORMS[D.form.ent], p = D.form.id ? { id: D.form.id } : {};
  for(const c of f.campos){
    const el = document.getElementById("ed_" + c.k); if(!el) continue;
    p[c.k] = c.tipo === "multi" ? [...el.querySelectorAll("input:checked")].map(i => i.value)
           : c.tipo === "check" ? el.checked : c.tipo === "number" ? (el.value === "" ? null : Number(el.value)) : el.value.trim();
  }
  return p;
}
// mensagem amigável para o erro do banco (ENX01 trava, ENX02 validação, 42501 permissão)
function erroBanco(e){
  if(!e) return "Não foi possível salvar.";
  if(e.code === "42501") return "Sua conta não pode alterar dados.";
  if(e.code === "ENX01" || e.code === "ENX02") return e.message;
  return "Não foi possível salvar. Tente de novo.";
}
async function abrirForm(ent, id){
  const f = FORMS[ent];
  if(f.antes) await f.antes();
  const lista = { concurso: D.cache.concursos, loja: D.cache.lojas }[ent] || [];
  const atual = id ? (lista.find(x => x.id === id) || {}) : { ...(f.novo || {}) };
  D.form = { ent, id: id || null, dados: f.prep && id ? f.prep(atual) : atual };
  telaDados(); window.scrollTo(0, 0);
  requestAnimationFrame(() => { const i = document.querySelector("#fEd input"); if(i) i.focus(); });
}
function fecharForm(recarregar){
  const f = D.form && FORMS[D.form.ent];
  D.form = null;
  if(recarregar && f) f.cache.forEach(k => delete D.cache[k]);
  abrirDados();
}
async function salvarForm(){
  const f = FORMS[D.form.ent], p = lerForm();
  const falta = f.campos.find(c => c.req && !p[c.k]);
  if(falta){ aviso(`Preencha: ${falta.rot}.`, true); document.getElementById("ed_" + falta.k)?.focus(); return; }
  const b = $("#fEd button[type=submit]"); b.disabled = true; b.textContent = "Salvando…";
  const { error } = await sb.rpc(f.salvar, { p });
  if(error){ console.warn(error); b.disabled = false; b.textContent = "Salvar"; aviso(erroBanco(error), true); return; }
  aviso(`${maiusc(f.rotulo)} ${f.fem ? "salva" : "salvo"}.`);
  fecharForm(true);
}
async function excluirForm(){
  const f = FORMS[D.form.ent], nome = D.form.dados?.nome || D.form.dados?.codigo || D.form.dados?.titulo || "este registro";
  if(!confirm(`Excluir ${f.rotulo} “${nome}”?\nSe houver dados ligados (itens, preços, métricas…), ${f.fem ? "ela" : "ele"} será só ${f.fem ? "desativada" : "desativado"}.`)) return;
  const { data, error } = await sb.rpc(f.excluir, { p_id: D.form.id });
  if(error){ console.warn(error); aviso(erroBanco(error), true); return; }
  aviso(String(data).startsWith("desativad") ? `Tem dados ligados: ${f.rotulo} ${f.fem ? "desativada" : "desativado"} (some do site, nada se perde).`
                                               : `${maiusc(f.rotulo)} ${f.fem ? "excluída" : "excluído"}.`);
  fecharForm(true);
}
const maiusc = t => t[0].toUpperCase() + t.slice(1);
const btnEditar = (ent, id) => podeEditar() ? `<button class="btn-ed" data-editar="${ent}" data-id="${esc(id)}">Editar</button>` : "";
const btnNovo = ent => podeEditar() ? `<button class="btn-ed" data-novo="${ent}">Novo</button>` : "";

function vConcursos(cs){
  cs = cs.slice().sort(ordConc);
  return `<div class="resumo"><h1>Concursos</h1><span class="cont num">${cs.filter(c=>c.ativo).length} ativos de ${cs.length}</span>${btnNovo("concurso")}</div>
    <div class="lista">${cs.map(c=>`<div class="reg"><div class="meio">
      <div class="nome">${esc(c.nome)} <span class="tags">${c.ativo ? tag("ativo") : tag("desativado","off")}${c.itens_iniciais ? tag("itens iniciais","ini") : ""}</span></div>
      <div class="ref">${c.rotulo ? `Botão: <b>${esc(c.rotulo)} ${esc(c.ano||"")}</b>` : "Sem textos (usa o nome)"}${c.selo ? ` · selo <b>${esc(c.selo)}</b>` : ""}${c.estado ? ` · ${esc(c.estado)}` : ""}</div>
      ${c.descricao ? `<div class="ref">${esc(c.descricao)}</div>` : ""}
      ${c.msg_whatsapp ? `<div class="ref">WhatsApp: "Sou do ${esc(c.msg_whatsapp)}"</div>` : ""}
    </div><div class="dir"><b class="num">${nInt(c.itens_enxoval)}</b>itens<br><span class="num">${nInt(c.loja_concurso)}</span> lojas${podeEditar() ? `<br>${btnEditar("concurso", c.id)}` : ""}</div></div>`).join("")}</div>`;
}
function concPills(cs){
  if(!D.conc || !cs.some(c=>c.id===D.conc)) D.conc = (cs.find(c=>c.ativo) || cs[0] || {}).id || "";
  return `<div class="concs" role="group" aria-label="Concurso">${cs.map(c=>`<button data-dconc="${esc(c.id)}" aria-pressed="${c.id===D.conc}">${esc(c.rotulo ? c.rotulo+" "+(c.ano||"") : c.nome)}${c.ativo?"":" (desativado)"}</button>`).join("")}</div>`;
}
// tipo do link, pelo endereço (só para a etiqueta)
function tipoLink(u){
  const x = String(u||"").toLowerCase();
  if(/youtube\.com|youtu\.be/.test(x)) return "YouTube";
  if(/\.pdf(\?|#|$)/.test(x)) return "PDF";
  if(/drive\.google|docs\.google/.test(x)) return "Drive";
  if(/spotify\.com/.test(x)) return "Spotify";
  if(/instagram\.com/.test(x)) return "Instagram";
  if(/apps\.apple\.com|play\.google\.com/.test(x)) return "App";
  return "Site";
}
function vBizus(bs, cs){
  cs = cs.slice().sort(ordConc);
  const pills = concPills(cs);
  const conc = cs.find(c=>c.id===D.conc);
  const doConc = bs.filter(b=>b.concurso_id===D.conc);
  const vis = doConc.filter(b=>bate(b.titulo, b.categoria, tipoLink(b.link)));
  const porCat = new Map(); for(const b of vis){ if(!porCat.has(b.categoria)) porCat.set(b.categoria, []); porCat.get(b.categoria).push(b); }
  let h = `<div class="resumo"><h1>Bizus</h1><span class="cont num">${doConc.length} link${doConc.length!==1?"s":""}</span></div>${pills}${buscaHTML("Buscar bizu")}`;
  if(!doConc.length) h += `<p class="vazio">Nenhum bizu para ${esc(conc?.nome || "este concurso")}.<br><small>Na planilha: crie a aba “${esc(conc?.rotulo || conc?.nome || "")} - Bizus para o CFP” com as colunas Categoria e Link.</small></p>`;
  else if(!vis.length) h += `<p class="vazio">Nenhum bizu encontrado.</p>`;
  for(const [cat, lista] of porCat){
    h += `<h2 class="cat">${esc(cat)} <span class="n">${lista.length}</span></h2><div class="lista">${lista.map(b=>{
      let host = ""; try{ host = new URL(b.link).hostname.replace(/^www\./, ""); }catch(_){}
      return `<div class="reg"><div class="meio">
        <div class="nome">${esc(b.titulo)} <span class="tags">${tag(tipoLink(b.link),"azul")}${b.ativo ? "" : tag("oculto","off")}</span></div>
        <div class="ref"><a href="${esc(b.link)}" target="_blank" rel="noopener">${esc(host || b.link)}</a></div>
      </div></div>`; }).join("")}</div>`;
  }
  return h;
}
function vItens(its, cs){
  cs = cs.slice().sort(ordConc);
  const pills = concPills(cs);
  const doConc = its.filter(i=>i.concurso_id===D.conc);
  const vis = doConc.filter(i=>bate(i.nome_padronizado, i.categoria)).sort((a,b)=>(a.categoria||"").localeCompare(b.categoria||"") || a.nome_padronizado.localeCompare(b.nome_padronizado));
  const porCat = new Map(); for(const i of vis){ const k = i.categoria || "Sem categoria"; if(!porCat.has(k)) porCat.set(k, []); porCat.get(k).push(i); }
  let h = `<div class="resumo"><h1>Itens do enxoval</h1><span class="cont num">${doConc.length} itens</span></div>
    ${pills}
    ${buscaHTML("Buscar item")}`;
  if(!vis.length) h += `<p class="vazio">Nenhum item encontrado.</p>`;
  for(const [cat, lista] of porCat){
    h += `<h2 class="cat">${esc(cat)} <span class="n">${lista.length}</span></h2><div class="lista">${lista.map(i=>{
      const ps = (i.precos||[]).filter(p=>p.preco!=null).sort((a,b)=>a.preco-b.preco);
      const ativos = ps.filter(p=>p.lojas && p.lojas.ativo!==false);
      const menor = ativos[0];
      return `<details><summary class="reg">${foto(i.link_foto, i.nome_padronizado)}<div class="meio">
          <div class="nome">${esc(i.nome_padronizado)}</div>
          <div class="ref">Qtd: <b>${qtdTxt(i.qtd_sugerida)}</b> <span class="tags">${i.item_inicial ? tag("inicial","ini") : ""}${i.feminino ? tag("feminino","azul") : ""}${i.produto_online_id ? tag("online","azul") : ""}</span></div>
        </div><div class="dir">${menor ? `<b class="num">${brl(menor.preco)}</b>${ativos.length} loja${ativos.length!==1?"s":""}` : `<span class="off">sem preço</span>`}</div></summary>
        <div class="det">${ps.length ? `<table>${ps.map(p=>`<tr class="${p.lojas && p.lojas.ativo===false ? "off" : ""}"><td>${esc(p.lojas?.nome||"?")}${p.lojas?.parceira ? " "+tag("parceira") : ""}${p.lojas && p.lojas.ativo===false ? " (desativada)" : ""}</td><td class="n num">${brl(p.preco)}</td></tr>`).join("")}</table>` : "Nenhuma loja com preço."}</div></details>`;
    }).join("")}</div>`;
  }
  return h;

function vLojas(ls){

                .sort((a,b)=>(b.ativo-a.ativo) || a.nome.localeCompare(b.nome));
  return `<div class="resumo"><h1>Lojas</h1><span class="cont num">${ls.filter(l=>l.ativo).length} ativas de ${ls.length}</span>${btnNovo("loja")}</div>

    ${buscaHTML("Buscar loja")}
    ${vis.length ? `<div class="lista">${vis.map(l=>{

  }

function vCupons(cs){
  cs = cs.slice().sort((a,b)=>(b.ativo-a.ativo) || a.codigo.localeCompare(b.codigo));
  return `<div class="resumo"><h1>Cupons</h1><span class="cont num">${cs.filter(c=>c.ativo).length} ativos de ${cs.length}</span></div>
    ${cs.length ? cs.map(c=>{
      const prods = (c.cupom_produtos||[]).map(x=>x.produtos_online?.nome).filter(Boolean).sort();
      const its = (c.cupom_itens||[]).map(x=>x.itens_enxoval).filter(Boolean).map(i=>`${i.nome_padronizado} (${i.concursos?.nome||"?"})`).sort();
      return `<div class="cupom"><div class="cod">${esc(c.codigo)} <span class="tags">${c.ativo ? tag("ativo") : tag("desativado","off")}</span></div>
        <p>${esc(c.lojas?.nome || "Sem loja")}${c.texto ? ` · “${esc(c.texto)}”` : ""}</p>
        ${prods.length ? `<p><b>Catálogo online</b></p><ul>${prods.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>` : ""}
        ${its.length ? `<p><b>Calculadora</b></p><ul>${its.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>` : ""}
        ${!prods.length && !its.length ? `<p>Nenhum produto vinculado.</p>` : ""}</div>`; }).join("") : `<p class="vazio">Nenhum cupom cadastrado.</p>`}`;
}
function telaDados(){
  cabecalho(true);
  const cache = D.cache[D.sub], pronto = cache && (!["itens","bizus"].includes(D.sub) || D.cache.concursos);
  let corpo = `<p class="vazio">Carregando…</p>`;
  if(pronto && D.form && podeEditar()){
    corpo = formHTML();
  } else if(pronto){
    D.form = null;
    corpo = D.sub === "concursos" ? vConcursos(cache) : D.sub === "itens" ? vItens(cache, D.cache.concursos)
          : D.sub === "lojas" ? vLojas(cache) : D.sub === "online" ? vOnline(cache)
          : D.sub === "bizus" ? vBizus(cache, D.cache.concursos) : vCupons(cache);
    corpo += avisoEd();
  }
  $("#tela").innerHTML = abasHTML() + subsHTML() + faixaEd() + corpo;
}
async function abrirDados(){
  telaDados();
  const sub = D.sub;
  try{ await Promise.all([dados(sub), lerStatusEdicao()]); }
  catch(e){ console.warn(e); if(A.aba==="dados" && D.sub===sub) aviso("Não foi possível carregar os dados.", true); return; }
  if(A.aba === "dados" && D.sub === sub) telaDados();
}

/* ---------------- eventos ---------------- */
document.addEventListener("input", ev=>{
  if(ev.target.id !== "dBusca") return;
  D.busca = ev.target.value; const pos = ev.target.selectionStart;
  telaDados(); const b = $("#dBusca"); if(b){ b.focus(); b.setSelectionRange(pos, pos); }
});
document.addEventListener("submit", ev=>{
  if(ev.target.id === "fEd"){ ev.preventDefault(); salvarForm(); }
});
document.addEventListener("submit", async ev=>{
  if(ev.target.id !== "fConvite") return;
  ev.preventDefault();
  const f = ev.target, b = f.querySelector("button[type=submit]");
  const email = f.email.value.trim().toLowerCase(), papel = f.papel.value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ aviso("Digite um e-mail válido.", true); f.email.focus(); return; }
  b.disabled = true; b.textContent = "Enviando…";
  const r = await equipeFn({ acao: "convidar", email, papel });
  b.disabled = false; b.textContent = "Convidar";
  if(!r || !r.ok){ aviso(r?.erro || "Não foi possível convidar.", true); return; }
  aviso(r.existente ? `${email} já tinha conta: foi adicionado e entra com a senha atual.` : `Convite enviado para ${email}.`);
  abrirEquipe();
});
document.addEventListener("change", async ev=>{
  const t = ev.target;
  if(t.id === "admLoja"){ ADM.loja = t.value; abrirMetricas(); return; }
  if(t.id === "admIni" || t.id === "admFim"){
    const ini = $("#admIni").value, fim = $("#admFim").value;
    if(!ini || !fim || ini > fim) return;
    ADM.ini = ini; ADM.fim = fim; ADM.preset = null; abrirMetricas(); return;
  }
  if(t.dataset.papel){
    t.disabled = true;
    const { error } = await sb.rpc("alterar_papel", { p_user: t.dataset.papel, p_papel: t.value });
    if(error){
      console.warn(error);
      if(error.code === "42501"){ aviso("Esta conta não pode alterar papéis. Confira com qual conta você está logado.", true); return iniciar(); }
      aviso("Não foi possível alterar o papel.", true);
    }
    else aviso("Papel alterado.");
    abrirEquipe();
  }
});
document.addEventListener("click", async ev=>{
  const a = ev.target.closest(".abas button");
  if(a && a.dataset.aba !== A.aba){ A.aba = a.dataset.aba; D.form = null; abrirAba(); window.scrollTo(0,0); return; }
  const sb_ = ev.target.closest("button[data-sub]");
  if(sb_ && sb_.dataset.sub !== D.sub){ D.sub = sb_.dataset.sub; D.busca = ""; D.form = null; abrirDados(); return; }
  const ed = ev.target.closest("[data-editar]");
  if(ed){ abrirForm(ed.dataset.editar, ed.dataset.id); return; }
  const nv = ev.target.closest("[data-novo]");
  if(nv){ abrirForm(nv.dataset.novo, null); return; }
  if(ev.target.closest("#edCancelar")){ fecharForm(false); return; }
  if(ev.target.closest("#edExcluir")){ excluirForm(); return; }
  const dc = ev.target.closest("button[data-dconc]");
  if(dc){ D.conc = dc.dataset.dconc; telaDados(); return; }
  const dt = ev.target.closest("button[data-dtipo]");
  if(dt){ D.tipo = dt.dataset.dtipo; telaDados(); return; }
  const pd = ev.target.closest("button[data-dias]");
  if(pd){ periodoPreset(+pd.dataset.dias); abrirMetricas(); return; }
  const rl = ev.target.closest("tr[data-loja]");
  if(rl){ ADM.loja = rl.dataset.loja; abrirMetricas(); window.scrollTo(0,0); return; }
  if(ev.target.closest("#admTodas")){ ADM.loja = ""; abrirMetricas(); return; }
  const rm = ev.target.closest("[data-remover]");
  if(rm){
    const m = (A.equipe||[]).find(x=>x.user_id===rm.dataset.remover); if(!m) return;
    if(!confirm(`Tirar o acesso de ${m.email} à administração?`)) return;
    rm.disabled = true;
    const r = await equipeFn({ acao: "remover", user_id: m.user_id });
    if(!r || !r.ok) aviso(r?.erro || "Não foi possível remover.", true); else aviso(`${m.email} removido da equipe.`);
    abrirEquipe();
  }
});
$("#btnSair").addEventListener("click", async ()=>{
  A.eu = null; await sb.auth.signOut(); A.papel = null; A.equipe = null; ADM.met = null; ADM.loja = ""; ADM.lojas = []; D.cache = {}; telaLogin();
});

/* ---------------- ciclo ---------------- */
let definindoSenha = LINK_EMAIL.tipo === "invite" || LINK_EMAIL.tipo === "recovery";
async function iniciar(){
  const { data } = await sb.auth.getSession();
  if(!data.session){
    if(LINK_EMAIL.erro) return telaLogin({ tipo:"erro", txt:"Esse link expirou ou já foi usado. Peça um novo ao proprietário (convite) ou use \"Esqueci minha senha\"." });
    return telaLogin();
  }
  A.eu = { id: data.session.user.id, email: data.session.user.email };
  if(definindoSenha) return telaNovaSenha();
  try{
    const { data: papel, error } = await sb.rpc("meu_papel");
    if(error) throw error;
    A.papel = papel || null;
    if(!A.papel) return telaAviso("Sem acesso", "Esta conta não faz parte da equipe do Enxoval do Aprovado.");
    abrirAba();
  }catch(e){
    console.warn(e);
    telaAviso("Não foi possível carregar", "Verifique a conexão e recarregue a página.");
  }
}
sb.auth.onAuthStateChange((ev, sessao)=>{
  if(ev === "PASSWORD_RECOVERY"){ definindoSenha = true; setTimeout(iniciar, 0); return; }
  // a sessão é compartilhada entre abas: se outra aba trocou de conta ou saiu, esta acompanha
  // (senão a tela continuaria com os botões da conta anterior e o banco recusaria os pedidos)
  if(!A.eu || definindoSenha) return;
  const id = sessao?.user?.id || null;
  if(id === A.eu.id) return;
  A.papel = null; A.equipe = null; ADM.met = null; D.cache = {};
  if(!id){ A.eu = null; aviso("Você saiu da conta em outra aba."); setTimeout(()=>telaLogin(), 0); return; }
  aviso(`Agora você está como ${sessao.user.email} (login feito em outra aba).`);
  setTimeout(iniciar, 0);
});
iniciar();
</script>
